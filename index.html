                        <th>描述</th>
                        <th>标签</th>
                        <th>投稿时间</th>
                        <th>AID</th>
                        <th>CID</th>
                        <th>状态</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
    
    <!-- 图片放大模态框 -->
    <div class="modal fade lightbox" id="imageModal" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="lightboxTitle">
        <div class="modal-dialog modal-dialog-centered" id="lightboxDialog">
            <div class="modal-content">
                <button type="button" class="lightbox-close" data-dismiss="modal" aria-label="关闭"><svg class="icon" aria-hidden="true"><use href="#i-x"/></svg></button>
                <div class="lightbox-stage">
                    <img id="modalImage" alt="视频封面" referrerpolicy="no-referrer" crossorigin="anonymous">
                    <div class="lightbox-error" id="lightboxError">
                        <svg class="icon" aria-hidden="true"><use href="#i-image-off"/></svg>
                        <p>封面加载失败</p>
                        <small>本地镜像和 B站 图床都没有拿到这张图</small>
                    </div>
                </div>
                <div class="lightbox-caption">
                    <div class="lightbox-caption__main">
                        <a id="lightboxTitle" class="lightbox-title" href="#" target="_blank" rel="noopener" title="在B站打开"></a>
                        <div class="lightbox-meta"><span id="lightboxDate" class="num"></span><span id="lightboxDuration" class="num"></span><span id="lightboxAid" class="id"></span></div>
                        <div id="lightboxStatus"></div>
                    </div>
                    <div class="lightbox-actions" id="lightboxActions"></div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- JavaScript 库 -->
    <script src="static/vendor/jquery-3.6.0.min.js"></script>
    <script src="static/vendor/bootstrap.bundle-4.6.0.min.js"></script>
    <script src="static/vendor/jquery.dataTables-1.10.21.min.js"></script>
    <script src="static/vendor/dataTables.bootstrap4-1.10.21.min.js"></script>
    
    <script>
        $(document).ready(function() {
            // 加载折叠状态
            loadCollapseStates();
            // 绑定状态筛选 chips
            bindStatusChips();
            // 绑定时长筛选下拉
            bindDurationFilter();
            // 绑定标签云点击
            bindTagCloud();
            // 绑定表格行内的委托事件（标签展开、封面放大）
            bindRowEvents();
            // 表格/卡片视图切换：先把上次选的视图应用到 body，避免加载完再闪一下
            bindViewToggle();
            // 加载视频数据
            loadVideoData();
        });

        // ===== 四态状态：available / backup / hidden / lost =====
        const STATUS_LABEL = {
            available: '现存',
            backup: '已删除 · 已补档',
            hidden: '仅自见',
            lost: '已删除 · 待补档'
        };

        // chips 用短标签，与 STATUS_LABEL 的长标签区分开
        const STATUS_CHIPS = [
            { key: '', label: '全部' },
            { key: 'available', label: '现存' },
            { key: 'backup', label: '已补档' },
            { key: 'lost', label: '待补档' },
            { key: 'hidden', label: '仅自见' }
        ];

        // 当前状态筛选：null 或状态键。它活在 ext.search 里，
        // 因此标签/日期筛选调用 columns().search('') 清列筛选时不会被重置。
        let currentStatusFilter = null;
        let statusFilterRegistered = false;

        // 与 scripts/enrich.py 的 status_key() 保持一致
        function statusOf(video) {
            if (video.is_available) return 'available';
            if (video.reupload_aid && !video.reupload_dead_at) return 'backup';
            if (video.status_code === 62012) return 'hidden';
            return 'lost';
        }

        function countByStatus(videos) {
            const counts = { available: 0, backup: 0, hidden: 0, lost: 0 };
            videos.forEach(video => { counts[statusOf(video)] += 1; });
            return counts;
        }

        function registerStatusFilter() {
            if (statusFilterRegistered) return;
            statusFilterRegistered = true;
            $.fn.dataTable.ext.search.push(function (settings, searchData, dataIndex, rowData) {
                if (settings.nTable.id !== 'videosTable') return true;
                return !currentStatusFilter || (rowData && rowData[7] === currentStatusFilter);
            });
        }

        function renderStatusChips(videos) {
            const container = document.getElementById('statusChips');
            if (!container) return;
            const counts = countByStatus(videos);
            const active = currentStatusFilter || '';
            container.innerHTML = STATUS_CHIPS.map(chip => {
                const count = chip.key === '' ? videos.length : counts[chip.key];
                return `<button type="button" class="chip${chip.key === active ? ' active' : ''}" data-status="${chip.key}" aria-pressed="${chip.key === active}">${chip.label} <b class="num">${count}</b></button>`;
            }).join('');
        }

        function bindStatusChips() {
            $(document).on('click', '#statusChips .chip', function () {
                const key = this.getAttribute('data-status') || '';
                currentStatusFilter = key === '' ? null : key;
                $('#statusChips .chip').removeClass('active').attr('aria-pressed', 'false');
                $(this).addClass('active').attr('aria-pressed', 'true');
                if ($.fn.DataTable.isDataTable('#videosTable')) {
                    $('#videosTable').DataTable().draw();
                }
            });
        }

        // ===== 时长筛选 =====
        // dur<=0 记为「时长未知」；le* 系列是"不超过"的累计区间，不是互斥分箱——
        // le10 会被 le15/le20/le30 包含，只有 le30 + gt30 + unknown 三者互斥、
        // 合起来等于全部视频，校验用这条关系即可
        const DURATION_LABELS = {
            le10: '10 分钟内',
            le15: '15 分钟内',
            le20: '20 分钟内',
            le30: '30 分钟内',
            gt30: '30 分钟以上',
            unknown: '时长未知'
        };

        let currentDurationFilter = '';
        let durationFilterRegistered = false;

        function matchesDurationFilter(video, key) {
            if (!key) return true;
            const dur = Number(video.duration) || 0;
            switch (key) {
                case 'unknown': return dur <= 0;
                case 'le10': return dur > 0 && dur <= 600;
                case 'le15': return dur > 0 && dur <= 900;
                case 'le20': return dur > 0 && dur <= 1200;
                case 'le30': return dur > 0 && dur <= 1800;
                case 'gt30': return dur > 1800;
                default: return true;
            }
        }

        function registerDurationFilter() {
            if (durationFilterRegistered) return;
            durationFilterRegistered = true;
            $.fn.dataTable.ext.search.push(function (settings, searchData, dataIndex) {
                if (settings.nTable.id !== 'videosTable') return true;
                if (!currentDurationFilter) return true;
                const video = (window.videosData || [])[dataIndex];
                return !!video && matchesDurationFilter(video, currentDurationFilter);
            });
        }

        // 数量按全部视频统计，不与状态 chips 相交
        function updateDurationOptionCounts(videos) {
            const select = document.getElementById('durationSelect');
            if (!select) return;
            Array.from(select.options).forEach(option => {
                const key = option.value;
                if (!key) return; // 「不限」不追加数量
                const label = DURATION_LABELS[key] || option.textContent;
                let count = 0;
                videos.forEach(video => { if (matchesDurationFilter(video, key)) count += 1; });
                option.textContent = `${label} (${count})`;
            });
        }

        function bindDurationFilter() {
            $(document).on('change', '#durationSelect', function () {
                currentDurationFilter = this.value;
                if ($.fn.DataTable.isDataTable('#videosTable')) {
                    $('#videosTable').DataTable().draw();
                }
            });
        }
        
        // ===== 视图模式：表格 / 卡片 =====
        const VIEW_STORAGE_KEY = 'view_mode';
        const TABLE_PAGE_LEN = 25;   // 表格每页行数
        const CARDS_PAGE_LEN = 24;   // 卡片每页张数：2/3/4 列都能排满
        let viewMode = 'table';

        // 没有记录时默认卡片（不分视口）
        function storedViewMode() {
            try {
                const saved = localStorage.getItem(VIEW_STORAGE_KEY);
                if (saved === 'table' || saved === 'cards') return saved;
            } catch (e) {
                // 隐私模式下 localStorage 可能直接抛错，忽略
            }
            return 'cards';
        }

        function bindViewToggle() {
            $(document).on('click', '#viewToggle .view-btn', function () {
                applyViewMode(this.dataset.view);
            });
            $(document).on('change', '#cardSortSelect', function () {
                if (!$.fn.DataTable.isDataTable('#videosTable')) return;
                const value = this.value;
                if (value === 'custom') return; // 兜底项只用来显示，选不中它
                $('#videosTable').DataTable()
                    .order(value === 'date-asc' ? [[4, 'asc']] : value === 'title-asc' ? [[1, 'asc']] : [[4, 'desc']])
                    .draw();
            });
            // 表格还没初始化，这一趟只切 body 类和按钮状态，避免加载完成后再闪一下
            applyViewMode(storedViewMode(), { initial: true });
        }

        // 卡片模式专用的排序行 + 网格容器：initComplete 里插到 .table-scroll 后面，
        // 这样 DataTables 的信息行和分页仍然在它们下面
        function setupCardView(table) {
            const scroll = $('#videosTable').closest('.table-scroll');
            if (!scroll.length || document.getElementById('cardGrid')) return;
            scroll.after('<div id="cardGrid" class="card-grid" role="list" hidden></div>');
            $('#cardGrid').before(
                '<div class="card-sort" id="cardSort" hidden>' +
                    '<label for="cardSortSelect">排序</label>' +
                    '<select id="cardSortSelect" class="custom-select custom-select-sm">' +
                        '<option value="date-desc">投稿时间 新 → 旧</option>' +
                        '<option value="date-asc">投稿时间 旧 → 新</option>' +
                        '<option value="title-asc">标题</option>' +
                        // 表头点出来的排序（标题倒序、AID/CID、多列）这三项表达不了，
                        // 用一个藏起来的兜底项如实显示，而不是谎报成其中之一
                        '<option value="custom" hidden>自定义</option>' +
                    '</select>' +
                '</div>'
            );
            applyViewMode(viewMode, { initial: true });
        }

        function applyViewMode(mode, options) {
            const next = mode === 'cards' ? 'cards' : 'table';
            const initial = !!(options && options.initial);
            // 点当前已经选中的那个按钮不该触发任何重绘
            if (next === viewMode && !initial) return;
            viewMode = next;
            const cards = viewMode === 'cards';

            document.body.classList.toggle('view-cards', cards);
            $('#viewToggle .view-btn').each(function () {
                const on = this.dataset.view === viewMode;
                this.classList.toggle('active', on);
                this.setAttribute('aria-pressed', String(on));
            });

            const grid = document.getElementById('cardGrid');
            const sort = document.getElementById('cardSort');
            if (grid) grid.hidden = !cards;
            if (sort) sort.hidden = !cards;

            // 只记用户自己点出来的选择；首次访问按视口推出来的默认值不落盘，
            // 免得把一次窄屏访问变成这台设备的永久偏好
            if (!initial) {
                try {
                    localStorage.setItem(VIEW_STORAGE_KEY, viewMode);
                } catch (e) {
                    // 存不下就算了，本次会话仍然按 viewMode 走
                }
            }

            if (!$.fn.DataTable.isDataTable('#videosTable')) return;
            const table = $('#videosTable').DataTable();
            if (cards) syncCardSort(table);

            // initial 那次表格已经画好了，只有卡片模式才需要补一次重绘去填 #cardGrid
            if (initial && !cards) return;

            // page.len() 只改设置不重绘，下面统一 draw(false) 一次，避免画两遍
            const len = table.page.len();
            if (cards && len === TABLE_PAGE_LEN) {
                table.page.len(CARDS_PAGE_LEN);
            } else if (!cards && len === CARDS_PAGE_LEN) {
                table.page.len(TABLE_PAGE_LEN);
            }
            table.draw(false);
        }

        // 进卡片模式时把下拉对齐到表格当前的排序。只认下拉真能表达的三种，
        // 其余（标题倒序、AID/CID、多列排序）一律显示「自定义」
        function syncCardSort(table) {
            const select = document.getElementById('cardSortSelect');
            if (!select) return;
            const order = table.order() || [];
            const first = order.length === 1 ? order[0] : null;
            const col = first ? Number(first[0]) : null;
            const dir = first ? first[1] : null;
            select.value = (col === 1 && dir === 'asc') ? 'title-asc'
                : (col === 4 && dir === 'asc') ? 'date-asc'
                : (col === 4 && dir === 'desc') ? 'date-desc'
                : 'custom';
        }

        // 上一趟渲染出来的卡片：行索引 → <article>，以及那趟的行索引串
        let cardNodes = new Map();
        let lastCardIndexes = null;

        // 在 drawCallback 里跑：当前页、当前筛选、当前排序的行索引与 window.videosData 一一对应
        function renderCards(table) {
            const grid = document.getElementById('cardGrid');
            if (!grid) return;
            if (viewMode !== 'cards') {
                // 表格模式下不留隐藏的卡片 DOM，免得封面和事件白挂着；
                // 丢弃前先把封面从 IntersectionObserver 上摘掉
                if (grid.firstChild) {
                    releaseLazyImages(grid);
                    grid.textContent = '';
                }
                cardNodes.clear();
                lastCardIndexes = null;
                return;
            }

            const indexes = table
                .rows({ page: 'current', search: 'applied', order: 'applied' })
                .indexes()
                .toArray();
            const key = indexes.join(',');
            // 行集和次序都没变（chips 反复点同一个、灯箱关闭引发的重绘等）就什么都不做
            if (key === lastCardIndexes && grid.firstChild) return;
            lastCardIndexes = key;

            // 按行索引复用上一趟的卡片节点：搜索框每敲一个字都会重绘，
            // 留在页面上的那些卡片直接搬过去，已经加载好的封面就不会被打回占位图
            const videos = window.videosData || [];
            const next = new Map();
            const frag = document.createDocumentFragment();
            const scratch = document.createElement('div');
            indexes.forEach(index => {
                let node = cardNodes.get(index);
                if (!node) {
                    scratch.innerHTML = cardHtml(videos[index]);
                    node = scratch.firstElementChild;
                }
                if (!node) return;
                next.set(index, node);
                frag.appendChild(node);
            });
            // 这一趟没被复用的旧卡片才需要解除观察，然后随 textContent 一起丢掉
            cardNodes.forEach((node, index) => {
                if (!next.has(index)) releaseLazyImages(node);
            });
            cardNodes = next;
            grid.textContent = '';
            if (indexes.length) {
                grid.appendChild(frag);
            } else {
                // 筛选后一行都不剩：表格本体会显示 DataTables 的空表提示，
                // 卡片视图下 #cardGrid 之前是空字符串，什么提示都看不到，这里补一条
                const empty = document.createElement('p');
                empty.className = 'card-grid__empty';
                empty.setAttribute('role', 'status');
                empty.textContent = cardGridEmptyText(table);
                grid.appendChild(empty);
            }
        }

        // 优先读 DataTables 语言包里配置的"无匹配结果"文案（表格本体就是显示这句），
        // 取不到就退回字面量兜底
        function cardGridEmptyText(table) {
            try {
                const lang = table.settings()[0].oLanguage;
                if (lang && lang.sZeroRecords) return lang.sZeroRecords;
            } catch (e) {
                // 忽略，走兜底文案
            }
            return '没有匹配结果';
        }

        function cardRibbon(status) {
            if (status === 'lost' || status === 'hidden') return '<span class="vcard__ribbon vcard__ribbon--lost">已删除</span>';
            if (status === 'backup') return '<span class="vcard__ribbon vcard__ribbon--backup">已补档</span>';
            return '';
        }

        function cardHtml(video) {
            if (!video) return '';
            const status = statusOf(video);
            const aid = video.aid;
            const title = video.title ? escapeHtml(video.title) : '无标题';
            // created_at 形如 "2026-08-26 07:30"，取前 16 位挡住可能带的秒
            const meta = [
                video.created_at ? escapeHtml(String(video.created_at).slice(0, 16)) : '',
                video.duration ? formatDuration(video.duration) : '',
                aid ? 'AV' + escapeHtml(String(aid)) : ''
            ].filter(Boolean).join(' · ');

            return `<article class="vcard vcard--${status}" role="listitem" data-aid="${aid}">
                        <div class="vcard__cover">${formatCover(video.cover, video.cover_local, aid)}${cardRibbon(status)}</div>
                        <div class="vcard__body">
                            <a class="vcard__title" href="https://www.bilibili.com/video/av${aid}" target="_blank" rel="noopener" title="在B站打开">${title}</a>
                            <div class="vcard__meta num">${meta}</div>
                            ${stampHtml(video, status)}
                            <div class="vcard__desc">${formatDescription(video.desc, aid)}</div>
                            <div class="vcard__tags">${formatTags(video.tags, aid)}</div>
                        </div>
                    </article>`;
        }

        function loadVideoData() {
            // 别名表拿不到就退化成空表，标签云仍按原始写法工作
            const aliasesPromise = fetch('data/tag_aliases.json')
                .then(response => (response.ok ? response.json() : null))
                .catch(() => null);

            fetch('db.json')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('文件不存在或无法访问');
                    }
                    return response.json();
                })
                .then(data => aliasesPromise.then(aliases => ({ data, aliases })))
                .then(({ data, aliases }) => {
                    const videos = data.videos || [];
                    window.videosData = videos; // 保存数据供其他函数使用
                    setTagAliases(aliases);
                    buildTagIndex(videos);
                    displayStats(videos, data.metadata);
                    createHeatmapCalendar(videos);
                    createTagCloud();
                    initializeTable(videos);
                    renderStatusChips(videos);
                    updateDurationOptionCounts(videos);
                    renderHeroBand(videos);
                    $('#loading').hide();
                    $('#videosTable').show();
                })
                .catch(error => {
                    console.error('加载数据失败:', error);
                    $('#loading').hide();
                    $('#errorMessage').show();
                });
        }
        
        function displayStats(videos, metadata) {
            const counts = countByStatus(videos);
            // 已删除 = 已补档 + 待补档 + 仅自见（即所有 is_available 为 false 的稿件）；
            // 仅自见单独在已删除卡的 stat-note 里交代，所以待补档卡与同名 chip 一样只算 lost
            const deleted = counts.backup + counts.lost + counts.hidden;
            const pending = counts.lost;

            $('#statTotal').text(videos.length.toLocaleString());
            $('#statAvailable').text(counts.available.toLocaleString());
            $('#statDeleted').text(deleted.toLocaleString());
            $('#statDeletedNote').text(counts.hidden ? `其中仅自见 ${counts.hidden}` : '');
            $('#statBackup').text(counts.backup.toLocaleString());
            $('#statPending').text(pending.toLocaleString());
            $('#statRecheck').text((metadata && metadata.last_recheck) || '—');

            renderSurvivalBar(counts);
        }

        function renderSurvivalBar(counts) {
            const bar = document.getElementById('survivalBar');
            const legend = document.getElementById('survivalLegend');
            if (!bar || !legend) return;

            const parts = [
                ['survival__ok', '现存', counts.available],
                ['survival__backup', '已补档', counts.backup],
                ['survival__hidden', '仅自见', counts.hidden],
                ['survival__lost', '待补档', counts.lost]
            ];

            bar.innerHTML = parts.filter(([, , count]) => count > 0).map(([cls, , count]) => `<span class="${cls}" style="flex:${count}"></span>`).join('');
            bar.setAttribute('aria-label', parts.map(([, label, count]) => `${label} ${count}`).join('，'));
            legend.textContent = parts.map(([, label, count]) => `${label} ${count}`).join(' · ');
        }
        
        function initializeTable(videos) {
            const tableData = videos.map(video => [
                formatCover(video.cover, video.cover_local, video.aid),
                formatTitle(video),
                formatDescription(video.desc, video.aid),
                formatTags(video.tags, video.aid),
                formatDate(video.created_at, video.created_timestamp),
                video.aid || '',
                video.cid || '',
                statusOf(video)
            ]);

            registerStatusFilter();
            registerDurationFilter();

            $('#videosTable').DataTable({
                data: tableData,
                pageLength: 25,
                lengthMenu: [[10, 25, 50, 100], [10, 25, 50, 100]], // 移除"全部"选项以提高性能
                language: {
                    url: 'static/vendor/dataTables-zh-1.10.21.json'
                },
                columnDefs: [
                    { orderable: false, targets: [0, 2, 3] }, // 封面、描述、标签不可排序
                    { width: "100px", targets: 0 }, // 封面列宽度
                    { width: "250px", targets: 1 }, // 标题列宽度
                    { width: "200px", targets: 2 }, // 描述列宽度
                    { width: "200px", targets: 3 }, // 标签列宽度
                    { width: "120px", targets: 4 }, // 时间列宽度
                    { className: "number-cell d-none d-lg-table-cell", targets: [5, 6] }, // AID和CID右对齐，窄屏隐藏
                    { targets: 7, visible: false, searchable: false } // 状态键，仅供 chips 筛选
                ],
                order: [[4, 'desc']], // 默认按时间降序排列
                deferRender: true, // 延迟渲染，提高性能
                processing: true, // 显示处理中状态
                drawCallback: function (settings) {
                    // 重新绑定事件和初始化懒加载
                    bindEvents();
                    // 卡片必须在懒加载之前渲染出来，新封面才能在同一趟里挂上观察器
                    renderCards(new $.fn.dataTable.Api(settings));
                    // 在空闲时间初始化懒加载，降低重绘压力
                    if ('requestIdleCallback' in window) {
                        // 带 timeout：连续打字时浏览器一直不空闲，没有上限的话
                        // 卡片会一直停在占位图上
                        requestIdleCallback(initLazyLoading, { timeout: 200 });
                    } else {
                        requestAnimationFrame(initLazyLoading);
                    }
                },
                // 横向滚动容器只包 <table>：写死在 HTML 里的话，DataTables 会把
                // 长度选择、搜索框、信息行和分页一起生成在滚动容器内部，窄屏上
                // 这些控件会跟着表格一起滑出视口
                initComplete: function (settings) {
                    $('#videosTable').wrap('<div class="table-scroll"></div>');
                    // 卡片网格插在滚动容器后面，并把上次选的视图应用上
                    setupCardView(new $.fn.dataTable.Api(settings));
                }
            });
        }
        
        function formatCover(coverUrl, coverLocal, aid) {
            if (!coverUrl) return '<span class="text-muted">无封面</span>';

            // 处理相对路径
            const fullUrl = coverUrl.startsWith('//') ? 'https:' + coverUrl : coverUrl;
            const localUrl = coverLocal || '';
            // 表格缩略图优先用本地镜像封面（同源、无第三方请求），没有的话才回退到 hdslb 原图
            const thumbSrc = localUrl || fullUrl;

            // 点击放大走委托事件：容器只带 aid，封面地址由 bindRowEvents() 回查
            // window.videosData，URL 不再拼进内联 onclick 字符串
            return `<div class="cover-container" data-aid="${aid}" role="button" tabindex="0" aria-label="查看封面大图">
                        <img class="video-cover lazy-image"
                             data-src="${thumbSrc}"
                             data-fallback="${localUrl ? fullUrl : ''}"
                             alt="视频封面"
                             referrerpolicy="no-referrer"
                             crossorigin="anonymous"
                             style="opacity: 0; pointer-events: none;">
                        <div class="cover-placeholder">
                            <svg class="icon" aria-hidden="true"><use href="#i-image"/></svg>
                        </div>
                    </div>`;
        }
        
        // 状态章：表格标题列与灯箱共用同一份渲染
        function stampHtml(video, status) {
            status = status || statusOf(video);
            const label = escapeHtml(STATUS_LABEL[status]);
            let stampAttrs = '';
            let stampBody = label;
            if (status === 'backup') {
                const reuploadUrl = `https://www.bilibili.com/video/av${video.reupload_aid}`;
                stampBody = `<a href="${reuploadUrl}" target="_blank" rel="noopener" title="点击查看补档">${label}</a>`;
            } else if (status === 'lost' && video.reupload_dead_at) {
                stampAttrs = ` title="补档 av${video.reupload_aid} 已于 ${escapeHtml(video.reupload_dead_at)} 发现不可见"`;
            }
            return `<span class="stamp stamp--${status}"${stampAttrs}><i></i>${stampBody}</span>`;
        }

        function formatDuration(seconds) {
            const s = Math.max(0, Math.round(seconds));
            const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
            const mm = String(m).padStart(h ? 2 : 1, '0'), ss = String(r).padStart(2, '0');
            return h ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
        }

        function formatTitle(video) {
            const title = video.title;
            if (!title) return '<span class="text-muted">无标题</span>';

            const status = statusOf(video);
            const bilibiliUrl = `https://www.bilibili.com/video/av${video.aid}`;
            const stamp = stampHtml(video, status);

            return `<div class="video-title${status === 'available' ? '' : ' unavailable'}">
                        <a href="${bilibiliUrl}" target="_blank" title="在B站打开">${escapeHtml(title)}</a>${stamp}
                    </div>`;
        }
        
        function formatDescription(desc, aid) {
            if (!desc) return '<span class="text-muted">无描述</span>';
            
            const safeDesc = escapeHtml(desc);
            const safeDescWithBreaks = safeDesc.replace(/\n/g, '<br>');
            
            return `<div class="video-desc" 
                         onclick="toggleDescription(this)" 
                         title="点击展开或收起描述">
                        ${safeDescWithBreaks}
                    </div>
                    <button type="button" class="copy-btn" data-copy="desc" data-aid="${aid}" title="复制完整简介"><svg class="icon" aria-hidden="true"><use href="#i-copy"/></svg> 复制简介</button>`;
        }
        
        // ===== 页眉封面带：往年同期投稿 =====
        // 月-日一律映射到 2000 年（闰年，装得下 2 月 29 日）算循环距离，
        // 不看年份，纯日历意义上的"同一天/同一周"
        function heroDayIndex(month, day) {
            return Date.UTC(2000, month - 1, day) / 86400000;
        }

        function parseCreatedYmd(video) {
            const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String((video && video.created_at) || ''));
            return m ? { year: Number(m[1]), month: Number(m[2]), day: Number(m[3]) } : null;
        }

        // 最多挑 8 条「历史上这几天」发的稿子：候选只取有本地镜像封面的视频
        // （零外部请求；整份数据都没有镜像时才退回 cover），排除今年的记录；
        // 按与今天的月日距离升序、同距离已删除优先、再按投稿时间升序取前 8，
        // 返回时按投稿时间升序排列（时间线感）
        function pickHeroVideos(videos, today) {
            // today 默认用访问者本地时区的 new Date()——这里的"今天"就是访问者的当地日期，故意不转 UTC
            today = (today instanceof Date) ? today : new Date();
            const thisYear = today.getFullYear();
            const todayIdx = heroDayIndex(today.getMonth() + 1, today.getDate());

            const mirrored = videos.filter(v => v.cover_local);
            const pool = mirrored.length ? mirrored : videos.filter(v => v.cover);

            const scored = [];
            pool.forEach(video => {
                const ymd = parseCreatedYmd(video);
                if (!ymd || ymd.year === thisYear) return; // 排掉"今年"的记录
                const diff = Math.abs(heroDayIndex(ymd.month, ymd.day) - todayIdx);
                const distance = Math.min(diff, 366 - diff);
                scored.push({ video, distance });
            });

            scored.sort((a, b) => {
                if (a.distance !== b.distance) return a.distance - b.distance;
                const aDeleted = statusOf(a.video) !== 'available' ? 0 : 1;
                const bDeleted = statusOf(b.video) !== 'available' ? 0 : 1;
                if (aDeleted !== bDeleted) return aDeleted - bDeleted;
                return a.video.created_at < b.video.created_at ? -1 : (a.video.created_at > b.video.created_at ? 1 : 0);
            });

            return scored.slice(0, 8)
                .map(item => item.video)
                .sort((a, b) => (a.created_at < b.created_at ? -1 : (a.created_at > b.created_at ? 1 : 0)));
        }

        // picked 是 pickHeroVideos() 的结果（按投稿时间升序）；用同一个 today 把每条
        // 与今天的距离重新算出带符号的偏移（正负天数，处理跨年环绕），取偏移的
        // 最小/最大值拼出日期范围
        function heroCaptionText(picked, today) {
            if (!picked.length) return '';
            today = (today instanceof Date) ? today : new Date();
            const todayIdx = heroDayIndex(today.getMonth() + 1, today.getDate());

            const years = Array.from(new Set(picked.map(v => parseCreatedYmd(v).year))).sort((a, b) => a - b);
            const yearsText = years.join('、') + ' 年';

            let allToday = true;
            const displayDates = picked.map(video => {
                const ymd = parseCreatedYmd(video);
                const rawDiff = heroDayIndex(ymd.month, ymd.day) - todayIdx;
                let offset = rawDiff;
                if (offset > 183) offset -= 366;
                else if (offset < -183) offset += 366;
                if (offset !== 0) allToday = false;
                return new Date(Date.UTC(today.getFullYear(), today.getMonth(), today.getDate() + offset));
            });

            // 年份单独包一层 span，窄屏隐藏它来缩短说明文字，避免换行；
            // 拼起来的可见文本（不算 span 标签本身）与隐藏前逐字一致
            if (allToday) {
                return `背景：往年今日的投稿<span class="hero-caption__years">（${yearsText}）</span>`;
            }

            const minDate = new Date(Math.min.apply(null, displayDates));
            const maxDate = new Date(Math.max.apply(null, displayDates));
            const minMonth = minDate.getUTCMonth() + 1;
            const maxMonth = maxDate.getUTCMonth() + 1;
            const rangeText = (minMonth === maxMonth)
                ? `${minMonth} 月 ${minDate.getUTCDate()}–${maxDate.getUTCDate()} 日`
                : `${minMonth} 月 ${minDate.getUTCDate()} 日–${maxMonth} 月 ${maxDate.getUTCDate()} 日`;

            return `背景：往年同期的投稿（${rangeText}<span class="hero-caption__years">；${yearsText}</span>）`;
        }

        function heroTileHtml(video) {
            const deleted = statusOf(video) !== 'available';
            const src = video.cover_local || video.cover;
            return `<div class="hero-band__tile${deleted ? ' hero-band__tile--deleted' : ''}">` +
                `<img src="${escapeHtml(src)}" alt="" decoding="async" fetchpriority="low" referrerpolicy="no-referrer">` +
                `</div>`;
        }

        function renderHeroBand(videos) {
            const band = document.getElementById('heroBand');
            const caption = document.getElementById('heroCaption');
            if (!band) return;

            const today = new Date();
            const picked = pickHeroVideos(videos, today);
            band.innerHTML = picked.map(heroTileHtml).join('');
            // 镜像封面偶尔会缺文件，加载失败就把整块摘掉，不留裂图占位
            band.querySelectorAll('img').forEach(img => {
                img.onerror = () => {
                    const tile = img.closest('.hero-band__tile');
                    if (tile) tile.remove();
                };
            });

            if (!caption) return;
            const text = heroCaptionText(picked, today);
            if (text) {
                // text 里带 <span class="hero-caption__years">，都是我们自己拼的数字/中文字面量，
                // 没有任何视频字段流入，innerHTML 是安全的
                caption.innerHTML = text;
                caption.hidden = false;
            } else {
                caption.textContent = '';
                caption.hidden = true;
            }
        }
        
        function formatTags(tags, aid) {
            if (!tags || tags.length === 0) return '<span class="text-muted">无标签</span>';

            // 单元格里只显示前 3 个标签，但 DataTables 的列筛选读的是这段 HTML 去标签后的文本，
            // 所以额外塞一份完整标签（| a | b | 形式，供整词匹配）到视觉隐藏的 span 里。
            // 放在 .tags-container 外面，免得 showAllTags() 重写容器时把它冲掉。
            const allTagsText = escapeHtml('| ' + tags.map(tag => String(tag).trim()).filter(Boolean).join(' | ') + ' |');

            // 展开按钮不带数据，点击时由 bindRowEvents() 用容器上的 data-aid 回查标签
            return `<div class="tags-container" data-aid="${aid}">
                        ${tags.slice(0, 3).map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join('')}
                        ${tags.length > 3 ? tagMoreButton(`+${tags.length - 3}`) : ''}
                    </div>
                    <span class="sr-only tags-all" aria-hidden="true">${allTagsText}</span>
                    <button type="button" class="copy-btn" data-copy="tags" data-aid="${aid}" title="复制全部标签，以 | 分隔"><svg class="icon" aria-hidden="true"><use href="#i-copy"/></svg> 复制标签</button>`;
        }

        function tagMoreButton(label) {
            return `<span class="tag tag-more" role="button" tabindex="0">${escapeHtml(label)}</span>`;
        }
        
        function formatDate(createdAt, timestamp) {
            if (createdAt) {
                return `<div class="date-cell">${escapeHtml(createdAt)}</div>`;
            } else if (timestamp) {
                const date = new Date(timestamp * 1000);
                return `<div class="date-cell">${date.toLocaleDateString('zh-CN')}</div>`;
            }
            return '<span class="text-muted">未知</span>';
        }
        
        function copyField(aid, field, btn) {
            const video = videoByAid(aid);
            if (!video) return;
            const text = field === 'tags' ? (video.tags || []).join(' | ') : (video.desc || '');
            copyText(text).then(ok => flashCopied(btn, ok));
        }

        function copyText(text) {
            if (navigator.clipboard && window.isSecureContext) {
                return navigator.clipboard.writeText(text).then(() => true, () => fallbackCopy(text));
            }
            return Promise.resolve(fallbackCopy(text));
        }

        function fallbackCopy(text) {
            const area = document.createElement('textarea');
            area.value = text;
            area.setAttribute('readonly', '');
            area.style.position = 'fixed';
            area.style.opacity = '0';
            document.body.appendChild(area);
            area.select();
            let ok = false;
            try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
            document.body.removeChild(area);
            return ok;
        }

        function flashCopied(btn, ok) {
            // 闪烁期间再点一次，原来会把「已复制」当成原始文案存下来，
            // 恢复后按钮就永远停在「已复制」上；所以原始文案只在第一次存进
            // data-label，并且闪烁中直接忽略重复触发
            if (btn.dataset.flashing === '1') return;
            if (!btn.dataset.label) btn.dataset.label = btn.innerHTML;
            btn.dataset.flashing = '1';
            btn.innerHTML = ok ? '<svg class="icon" aria-hidden="true"><use href="#i-check"/></svg> 已复制' : '<svg class="icon" aria-hidden="true"><use href="#i-x"/></svg> 复制失败';
            btn.classList.add(ok ? 'copied' : 'failed');
            setTimeout(() => {
                btn.innerHTML = btn.dataset.label;
                btn.classList.remove('copied', 'failed');
                delete btn.dataset.flashing;
            }, 1500);
        }

        function toggleDescription(element) {
            element.classList.toggle('expanded');
            const expanded = element.classList.contains('expanded');
            element.setAttribute('title', expanded ? '点击收起描述' : '点击展开描述');
        }

        let lightboxToken = 0;       // 每次打开 +1，让上一次未完成的图片探测作废
        let lightboxTrigger = null;  // 打开灯箱的元素，关闭后把焦点还回去

        function showImageModal(video, trigger) {
            const modalImage = document.getElementById('modalImage');
            const errorDiv = document.getElementById('lightboxError');
            const dialog = document.getElementById('lightboxDialog');
            const cover = video.cover || '';
            const fullUrl = cover.startsWith('//') ? 'https:' + cover : cover;
            const localUrl = video.cover_local || '';
            const token = ++lightboxToken;
            lightboxTrigger = trigger || null;

            // 重置状态：图片先不显示，避免探测期间闪出 alt 文字
            modalImage.style.display = 'none';
            modalImage.removeAttribute('src');
            errorDiv.style.display = 'none';
            dialog.style.maxWidth = '';
            modalImage.onload = function () {
                if (token !== lightboxToken) return;
                // 对话框按图片实际宽度收窄：本地 480px 镜像最多放大到 640px，原图最多 1120px，
                // 再受视口 92% 约束（内联样式会盖过 CSS 里的 min(92vw, …)）
                const natural = modalImage.naturalWidth || 0;
                if (!natural) return;
                const target = Math.min(Math.max(natural, 640), 1120, Math.floor(window.innerWidth * 0.92));
                dialog.style.maxWidth = target + 'px';
            };

            renderLightboxCaption(video);
            $('#imageModal').modal('show');

            // 关闭后把焦点还给打开它的封面（行可能已被 DataTables 重绘，先确认还在文档里）
            $('#imageModal').off('hidden.bs.modal.focus').on('hidden.bs.modal.focus', function() {
                if (lightboxTrigger && document.contains(lightboxTrigger)) {
                    lightboxTrigger.focus();
                } else if (document.activeElement && document.activeElement.blur) {
                    document.activeElement.blur();
                }
                lightboxTrigger = null;
            });

            // 大图优先 B站 原图（更清晰，只在点开时才请求），拿不到再用本地 480px 镜像
            setTimeout(() => {
                tryLoadImage(modalImage, [fullUrl, localUrl], errorDiv, () => token === lightboxToken, () => {
                    dialog.style.maxWidth = '480px'; // 失败提示不需要一整块宽对话框
                });
            }, 100);
        }

        function renderLightboxCaption(video) {
            const status = statusOf(video);
            const title = document.getElementById('lightboxTitle');
            title.textContent = video.title || '无标题';
            title.href = `https://www.bilibili.com/video/av${video.aid}`;
            document.getElementById('lightboxDate').textContent = (video.created_at || '').slice(0, 16);
            document.getElementById('lightboxDuration').textContent = video.duration ? formatDuration(video.duration) : '';
            document.getElementById('lightboxAid').textContent = `AV${video.aid}${video.bvid ? ' · ' + video.bvid : ''}`;
            document.getElementById('lightboxStatus').innerHTML = stampHtml(video, status);

            const aid = video.aid;
            let actions = `<a class="copy-btn" href="https://www.bilibili.com/video/av${aid}" target="_blank" rel="noopener">在 B站 打开</a>`;
            if (status === 'backup') {
                actions += `<a class="copy-btn" href="https://www.bilibili.com/video/av${video.reupload_aid}" target="_blank" rel="noopener">查看补档</a>`;
            }
            actions += `<button type="button" class="copy-btn" data-copy="desc" data-aid="${aid}" title="复制完整简介"><svg class="icon" aria-hidden="true"><use href="#i-copy"/></svg> 复制简介</button>`;
            actions += `<button type="button" class="copy-btn" data-copy="tags" data-aid="${aid}" title="复制全部标签，以 | 分隔"><svg class="icon" aria-hidden="true"><use href="#i-copy"/></svg> 复制标签</button>`;
            document.getElementById('lightboxActions').innerHTML = actions;
        }

        function tryLoadImage(imgElement, urls, errorDiv, stillCurrent, onExhausted) {
            const candidates = (urls || []).filter(Boolean);
            const isCurrent = () => !stillCurrent || stillCurrent();
            let currentAttempt = 0;

            function attemptLoad() {
                if (!isCurrent()) return; // 灯箱已换了一张图，放弃这一轮探测
                if (currentAttempt >= candidates.length) {
                    // 所有候选地址都失败了
                    imgElement.style.display = 'none';
                    errorDiv.style.display = 'block';
                    if (onExhausted) onExhausted();
                    return;
                }

                const url = candidates[currentAttempt];
                let settled = false;

                // 创建新的图片元素进行测试
                const testImg = new Image();
                testImg.crossOrigin = 'anonymous';
                // hdslb 对带 Referer 的跨站请求会返回 403，必须与 #modalImage 的
                // referrerpolicy="no-referrer" 保持一致，否则 hdslb 候选永远测试失败
                testImg.referrerPolicy = 'no-referrer';

                testImg.onload = function() {
                    if (settled) return;
                    settled = true;
                    if (!isCurrent()) return;
                    imgElement.src = url;
                    imgElement.style.display = 'block';
                    errorDiv.style.display = 'none';
                };

                testImg.onerror = function() {
                    if (settled) return;
                    settled = true;
                    currentAttempt++;
                    setTimeout(attemptLoad, 500); // 延迟500ms后尝试下一种方法
                };

                // 设置5秒超时
                setTimeout(() => {
                    if (!settled) testImg.onerror();
                }, 5000);

                testImg.src = url;
            }

            attemptLoad();
        }
        
        function showAllTags(element, allTags) {
            const container = element.closest('.tags-container');
            if (!container) return;
            const renderTags = tags => tags.map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join('');

            // 如果已经展开，则收起
            if (container.classList.contains('tags-expanded')) {
                // 恢复原始状态
                container.innerHTML = renderTags(allTags.slice(0, 3)) + tagMoreButton(`+${allTags.length - 3}`);
                container.classList.remove('tags-expanded');
            } else {
                // 展开所有标签
                container.innerHTML = renderTags(allTags) + tagMoreButton('收起');
                container.classList.add('tags-expanded');
            }
            const next = container.querySelector('.tag-more');
            if (next) next.focus();
        }

        // aid 在 JSON 里是数字、在 data-aid 上是字符串，统一按字符串比对
        function videoByAid(aid) {
            const key = String(aid);
            return (window.videosData || []).find(v => String(v.aid) === key);
        }

        // 表格行 / 卡片内的委托事件：+N 展开标签、点击封面看大图。
        // 只在 ready 时绑一次，DataTables 每次重绘出来的新行、新卡片自动生效
        function bindRowEvents() {
            const openTags = element => {
                const container = element.closest('.tags-container');
                if (!container) return;
                const video = videoByAid(container.dataset.aid);
                if (!video) return;
                showAllTags(element, video.tags || []);
            };
            const openCover = container => {
                const video = videoByAid(container.dataset.aid);
                if (!video || !(video.cover || video.cover_local)) return;
                showImageModal(video, container);
            };

            $(document).on('click', '#videosTable .tag-more, #cardGrid .tag-more', function () {
                openTags(this);
            });
            $(document).on('keydown', '#videosTable .tag-more, #cardGrid .tag-more', function (e) {
                if (!isActivationKey(e)) return;
                e.preventDefault();
                openTags(this);
            });
            $(document).on('click', '#videosTable .cover-container, #cardGrid .cover-container', function () {
                openCover(this);
            });
            $(document).on('keydown', '#videosTable .cover-container, #cardGrid .cover-container', function (e) {
                if (!isActivationKey(e)) return;
                e.preventDefault();
                openCover(this);
            });
            // 复制按钮（表格行 + 灯箱）统一委托，不再内联 onclick
            $(document).on('click', '.copy-btn[data-copy]', function () {
                copyField(this.dataset.aid, this.dataset.copy, this);
            });
        }

        // 键盘上等价于点击的按键：role="button" 的元素要自己处理 Enter / 空格
        function isActivationKey(e) {
            return e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar';
        }
        
        function bindEvents() {
            // 封面悬停效果已在CSS中实现
        }

        let lazyImageObserver = null;

        // 懒加载图片的实际赋值 + 成功/失败处理：IntersectionObserver 分支和
        // 不支持 IntersectionObserver 时的兜底分支共用这一份逻辑，只写一次
        function attachLazyImage(img, placeholder) {
            const imageSrc = img.getAttribute('data-src');
            if (!imageSrc) {
                return;
            }

            img.onload = function() {
                img.style.opacity = '1';
                img.style.pointerEvents = 'auto';
                img.classList.add('loaded');
                if (placeholder) {
                    placeholder.style.display = 'none';
                }
            };

            img.onerror = function() {
                // 本地镜像封面缺失/404 时，回退到 hdslb 原图再试一次（只重试一次，
                // 避免两边都失败时反复触发 onerror）；referrerpolicy="no-referrer"
                // 已经写在元素的 HTML 属性上，重新赋值 src 时同样生效
                const fallback = img.dataset.fallback;
                if (fallback && img.dataset.fallbackTried !== '1') {
                    img.dataset.fallbackTried = '1';
                    img.src = fallback;
                    return;
                }
                img.style.display = 'none';
                if (placeholder) {
                    placeholder.innerHTML = '<svg class="icon" aria-hidden="true"><use href="#i-image-off"/></svg>';
                    placeholder.classList.remove('lazy-loading');
                }
            };

            img.src = imageSrc;
        }

        function releaseLazyImages(root) {
            if (!root) return;
            root.querySelectorAll('.lazy-image').forEach(img => {
                if (lazyImageObserver) lazyImageObserver.unobserve(img);
                // 标记也一并清掉：这张图要是再回到页面上，还能重新排进懒加载
                delete img.dataset.lazyAttached;
            });
        }

        function initLazyLoading() {
            const lazyImages = document.querySelectorAll('.lazy-image');
            if (lazyImages.length === 0) {
                return;
            }

            if (!('IntersectionObserver' in window)) {
                lazyImages.forEach(img => {
                    if (img.dataset.lazyAttached === 'true') {
                        return;
                    }
                    img.dataset.lazyAttached = 'true';
                    const container = img.parentElement;
                    const placeholder = container ? container.querySelector('.cover-placeholder') : null;
                    attachLazyImage(img, placeholder);
                });
                return;
            }

            if (!lazyImageObserver) {
                lazyImageObserver = new IntersectionObserver((entries, observer) => {
                    entries.forEach(entry => {
                        if (!entry.isIntersecting) {
                            return;
                        }

                        const img = entry.target;
                        const container = img.parentElement;
                        const placeholder = container ? container.querySelector('.cover-placeholder') : null;

                        if (placeholder) {
                            placeholder.classList.add('lazy-loading');
                        }

                        attachLazyImage(img, placeholder);

                        observer.unobserve(img);
                    });
                }, {
                    root: null,
                    rootMargin: '50px',
                    threshold: 0.1
                });
            }

            lazyImages.forEach(img => {
                if (img.dataset.lazyAttached === 'true') {
                    return;
                }
                img.dataset.lazyAttached = 'true';
                lazyImageObserver.observe(img);
            });
        }
        
        const RECENT_YEAR_COUNT = 2;

        let availableYears = [];
        let heatmapDailyData = {};
        
        function createHeatmapCalendar(videos) {
            const dailyData = processDailyData(videos);
            const container = document.getElementById('heatmapCalendar');
            
            if (Object.keys(dailyData).length === 0) {
                container.innerHTML = '<div class="heatmap-loading"><span>暂无发布数据</span></div>';
                return;

            // 保存全局数据
            heatmapDailyData = dailyData;
            availableYears = getYearsFromData(dailyData);

            renderHeatmapCalendar();
        }
        
        function heatmapShowsAllYears() {
            try {
                return localStorage.getItem('heatmap_all_years') === '1';
            } catch (e) {
                return false;
            }
        }
        
        function toggleHeatmapYears() {

            try {
                localStorage.setItem('heatmap_all_years', showAll ? '1' : '0');

            // 收起到最近两年时，落在被隐藏年份上的日期筛选就再也点不到了，

            if (!showAll && currentDateFilter) {

        function renderHeatmapCalendar() {

            const allYears = [...availableYears].sort((a, b) => b - a);
            const showAll = heatmapShowsAllYears();

            heatmapHTML += createHeatmapLegend();

            yearsToRender.forEach(year => {

        function processDailyData(videos) {
            const daily = {};
            
            videos.forEach(video => {
                // 日期键直接取 created_at 的前 10 位（数据里已经是投稿当天的日期）。
                // 走 new Date(timestamp) 会按访客本地时区分桶，同一期投稿在不同时区
                // 会落进不同的日格，也对不上日期筛选（筛的是第 4 列的 created_at 文本）
                let dateKey;
                if (video.created_at) {
                    dateKey = String(video.created_at).slice(0, 10);
                } else if (video.created_timestamp) {
                    dateKey = formatDateKey(new Date(video.created_timestamp * 1000));
                } else {
                    return;
                }
                if (!/^\d{4}-\d{2}-\d{2}$/.test(dateKey)) return;

                if (!daily[dateKey]) {
                    daily[dateKey] = { count: 0, available: 0, backup: 0, hidden: 0, lost: 0 };
                }
                daily[dateKey].count += 1;
                daily[dateKey][statusOf(video)] += 1;
            });
            
            return daily;
        }
        
        // 日格状态码：无投稿 none / 全部现存 ok / 有已补档 backup /
        // 无现存且无补档 lost / 其余 mixed
        function dayStatusCode(day) {
            if (!day || day.count === 0) return 'none';
            if (day.available === day.count) return 'ok';
            if (day.backup > 0) return 'backup';
            if (day.available === 0 && day.lost === 0 && day.hidden > 0) return 'hidden';
            if (day.available === 0) return 'lost';
            return 'mixed';
        }
        
        function formatDateKey(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }
        
        function getYearsFromData(dailyData) {
            const years = new Set();
            Object.keys(dailyData).forEach(dateKey => {
                years.add(parseInt(dateKey.split('-')[0]));
            });
            return Array.from(years).sort((a, b) => a - b); // 升序排列，最早年份在前
        }
        
        const HEATMAP_LEGEND = [
            ['none', '无投稿'],
            ['ok', '全部现存'],
            ['backup', '含已补档'],
            ['hidden', '仅自见'],
            ['lost', '全部待补档'],
            ['mixed', '部分已删除']
        ];
        
        function createHeatmapLegend() {
            const items = HEATMAP_LEGEND
                .map(([code, label]) => `<span class="heatmap-legend-item"><i class="heatmap-day day-${code}"></i>${label}</span>`)
                .join('');
            return `<div class="heatmap-legend">${items}</div>`;
        }
        
        function createYearHeatmap(year, dailyData) {
            let html = `
                <div class="heatmap-year" id="year-${year}">
                    <div class="heatmap-year-title">${year}年</div>
                    <div class="heatmap-months">
                        <span>1月</span><span>2月</span><span>3月</span><span>4月</span>
                        <span>5月</span><span>6月</span><span>7月</span><span>8月</span>
                        <span>9月</span><span>10月</span><span>11月</span><span>12月</span>
                    </div>
                    <div class="heatmap-days">
            `;
            
            // 创建一个7行53列的网格（按列填充）
            const grid = [];
            for (let row = 0; row < 7; row++) {
                grid[row] = new Array(53).fill(null);
            }
            
            // 计算一年的第一天是星期几
            const firstDay = new Date(year, 0, 1);
            const firstDayWeek = firstDay.getDay();
            
            // 填充每一天到网格中
            const daysInYear = isLeapYear(year) ? 366 : 365;
            for (let day = 0; day < daysInYear; day++) {
                const currentDate = new Date(year, 0, 1 + day);
                const dateKey = formatDateKey(currentDate);
                const dayData = dailyData[dateKey];
                const count = dayData ? dayData.count : 0;
                const code = dayStatusCode(dayData);
                const hasVideos = count > 0 ? ' has-videos' : '';
                
                // 计算在网格中的位置
                const totalDays = firstDayWeek + day;
                const col = Math.floor(totalDays / 7);
                const row = totalDays % 7;
                
                if (col < 53) {
                    grid[row][col] = {
                        dateKey,
                        count,
                        code,
                        hasVideos
                    };
                }
            }
            
            // 按行输出网格（这样CSS Grid会按列排列）
            for (let row = 0; row < 7; row++) {
                for (let col = 0; col < 53; col++) {
                    const dayData = grid[row][col];
                    if (dayData) {
                        // 只有有投稿的日格能点，也就只有它们进 Tab 序列
                        const focusable = dayData.count > 0 ? ` role="button" tabindex="0" aria-label="${dayData.dateKey} · ${dayData.count} 期"` : '';
                        html += `<div class="heatmap-day day-${dayData.code}${dayData.hasVideos}" 
                                      data-date="${dayData.dateKey}" 
                                      data-count="${dayData.count}"${focusable}></div>`;
                    } else {
                        html += '<div class="heatmap-day" style="opacity: 0;"></div>';
                    }
                }
            }
            
            html += '</div></div>';
            return html;
        }
        
        function isLeapYear(year) {
            return (year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0);
        }
        
        // 「现存 x · 已补档 y · 待补档 z」，仅自见只有真的存在时才追加，
        // 免得几个数字加起来对不上当天/全站的投稿数
        function formatStatusBreakdown(day) {
            let text = `现存 ${day.available} · 已补档 ${day.backup} · 待补档 ${day.lost}`;
            if (day.hidden) {
                text += ` · 仅自见 ${day.hidden}`;
            }
            return text;
        }

        function createHeatmapStats(dailyData) {
            const days = Object.values(dailyData);
            const activeDays = days.filter(day => day.count > 0).length;
            const totals = days.reduce((acc, day) => {
                acc.available += day.available;
                acc.backup += day.backup;
                acc.hidden += day.hidden;
                acc.lost += day.lost;
                return acc;
            }, { available: 0, backup: 0, hidden: 0, lost: 0 });

            const selected = currentDateFilter ? dailyData[currentDateFilter] : null;
            const filterInfo = currentDateFilter
                ? `<div class="heatmap-stats-filter">当前筛选：${formatDisplayDate(currentDateFilter)} · ${selected ? selected.count : 0} 期（${selected ? formatStatusBreakdown(selected) : '无投稿'}） <a href="javascript:clearDateFilter()">清除筛选</a></div>`
                : '<div class="heatmap-stats-hint">提示：点击任意有颜色的日期可筛选当天投稿</div>';

            return `
                <div class="heatmap-stats">
                    <strong>存续统计：</strong>
                    ${activeDays} 天有投稿 · ${formatStatusBreakdown(totals)}
                    ${filterInfo}
                </div>
            `;
        }
        
        function bindHeatmapEvents() {
            const tooltip = document.getElementById('heatmapTooltip');
            const days = document.querySelectorAll('.heatmap-day[data-date]');
            
            days.forEach(day => {
                day.addEventListener('mouseenter', (e) => {
                    const date = e.target.getAttribute('data-date');
                    const dayData = heatmapDailyData[date];
                    const count = dayData ? dayData.count : 0;
                    
                    let tooltipText = count > 0
                        ? `${date} · ${count} 期：${formatStatusBreakdown(dayData)}`
                        : `${date} · 无投稿`;
                    if (count > 0) {
                        tooltipText += '<br><small>点击筛选当天投稿</small>';
                    }
                    
                    tooltip.innerHTML = tooltipText;
                    tooltip.classList.add('show');
                    
                    // 使用 pageX/pageY 考虑滚动偏移
                    tooltip.style.left = (e.pageX + 10) + 'px';
                    tooltip.style.top = (e.pageY + 10) + 'px';
                });
                
                // 鼠标移动时更新悬浮框位置
                day.addEventListener('mousemove', (e) => {
                    if (!tooltip.classList.contains('show')) return;
                    
                    tooltip.style.left = (e.pageX + 10) + 'px';
                    tooltip.style.top = (e.pageY + 10) + 'px';
                });
                
                day.addEventListener('mouseleave', () => {
                    tooltip.classList.remove('show');

                // 添加点击事件
                day.addEventListener('click', (e) => {

                    const count = parseInt(e.target.getAttribute('data-count'));
                    
                    if (count > 0) {
                        filterByDate(date);
                    }
                });
                
                // 键盘等价：Enter / 空格与点击同义
                day.addEventListener('keydown', (e) => {
                    if (!isActivationKey(e)) return;
                    const count = parseInt(day.getAttribute('data-count'));
                    if (count > 0) {
                        e.preventDefault();
                        filterByDate(day.getAttribute('data-date'));
                    }

        }
        
        function formatDisplayDate(dateKey) {
            const [year, month, day] = dateKey.split('-');
            return `${year}年${parseInt(month)}月${parseInt(day)}日`;
        }
        
        function filterByDate(date) {
            // 如果点击的是当前选择的日期，则取消筛选
            if (currentDateFilter === date) {
                clearDateFilter();
                return;
            }
            
            currentDateFilter = date;
            
            // 清除标签筛选
            if (currentTagFilter) {
                clearTagFilter();
            }
            // 更新视觉状态
            updateHeatmapSelection();
            updateDateFilterStats();
            filterTableByDate();
        }
        
        function clearDateFilter() {
            currentDateFilter = null;
            updateHeatmapSelection();
            updateDateFilterStats();
            filterTableByDate();
        }
        
        function updateHeatmapSelection() {
            const days = document.querySelectorAll('.heatmap-day[data-date]');
            
            days.forEach(day => {
                const date = day.getAttribute('data-date');
                
                if (currentDateFilter === null) {

                } else if (date === currentDateFilter) {

                    day.classList.remove('selected');

        function updateDateFilterStats() {
            const statsElement = document.querySelector('.heatmap-stats');
            if (!statsElement) {
                return;
            }
            statsElement.outerHTML = createHeatmapStats(heatmapDailyData);
        }
        
        function filterTableByDate() {
            // 检查 DataTables 是否已经初始化
            if (!$.fn.DataTable.isDataTable('#videosTable')) {
                return;
            }
            
            const table = $('#videosTable').DataTable();
            
            // 只动列筛选，不碰 table.search()：全局搜索框里的关键词要和
            // 日期筛选取交集，否则输入框还显示着关键词、结果却已经被悄悄放大
            if (currentDateFilter === null) {
                table.columns().search('').draw();
            } else {
                // 搜索日期格式：2025-07-16 或 2025年7月16日
                const [year, month, day] = currentDateFilter.split('-');
                const searchDate = `${year}-${month.padStart(2, '0')}-${day.padStart(2, '0')}`;
                const searchDateChinese = `${year}年${parseInt(month)}月${parseInt(day)}日`;

                table.columns().search(''); // 清除所有列的搜索（含标签列，标签与日期互斥）
                // 只在时间列（第4列，索引为4）进行搜索
                table.column(4).search(`${searchDate}|${searchDateChinese}`, true, false).draw();
            }
        }
        
        let currentTagFilter = null;
        let currentDateFilter = null;
        
        function createTagCloud() {
            const tagFrequency = calculateTagFrequency();
            const tagCloudElement = document.getElementById('tagCloud');
            
            if (tagFrequency.length === 0) {
                tagCloudElement.innerHTML = '<div class="tag-cloud-loading"><span>暂无标签数据</span></div>';
                return;
            }
            
            const maxFreq = Math.max(...tagFrequency.map(t => t.count));
            const minFreq = Math.min(...tagFrequency.map(t => t.count));
            
            const tagElements = tagFrequency.map(tagData => {
                const { tag, count } = tagData;
                const sizeLevel = calculateSizeLevel(count, minFreq, maxFreq);
                const heatLevel = calculateHeatLevel(count, minFreq, maxFreq);
                
                return `<span class="cloud-tag size-${sizeLevel} heat-${heatLevel}" 
                              data-tag="${escapeHtml(tag)}" 
                              data-count="${count}"
                              role="button" tabindex="0"
                              title="${escapeHtml(tag)} (${count} 个视频)">
                            ${escapeHtml(tag)}
                        </span>`;
            }).join('');
            
            const statsHtml = `
                <div class="tag-stats">
                    <strong>标签统计：</strong>共 ${tagFrequency.length} 个标签，
                    最热门：${escapeHtml(tagFrequency[0].tag)} (${tagFrequency[0].count} 个视频)，
                    最冷门：${escapeHtml(tagFrequency[tagFrequency.length - 1].tag)} (${tagFrequency[tagFrequency.length - 1].count} 个视频)
                    ${currentTagFilter ? `<br><strong>当前筛选：</strong>${escapeHtml(currentTagFilter)} <a href="javascript:clearTagFilter()" style="color: var(--accent-color); text-decoration: none;">[清除筛选]</a>` : ''}
                </div>
            `;
            
            tagCloudElement.innerHTML = tagElements + statsHtml;
        }
        
        // ===== 标签归一化 =====
        // canonical: 小写原始写法 -> 展示名；hidden: 频道通用标签，不进标签云
        let tagAliases = { canonical: {}, hidden: [] };
        let tagHiddenSet = new Set();      // 小写
        let tagDisplayByLower = new Map(); // 小写 -> 展示名，隐藏标签为 null
        let tagVariants = new Map();       // 展示名 -> Set(出现过的原始写法)
        let tagVideoCount = new Map();     // 展示名 -> 含该标签的视频数

        function setTagAliases(aliases) {
            tagAliases = {
                canonical: (aliases && aliases.canonical) || {},
                hidden: (aliases && aliases.hidden) || []
            };
            tagHiddenSet = new Set(tagAliases.hidden.map(tag => String(tag).trim().toLowerCase()));
        }

        function normalizeTag(tag) {
            const t = String(tag == null ? '' : tag).trim();
            if (!t) return null;
            const lower = t.toLowerCase();
            if (tagHiddenSet.has(lower)) return null;
            if (tagDisplayByLower.has(lower)) return tagDisplayByLower.get(lower);
            return tagAliases.canonical[lower] || t;
        }

        // 预先统计全部原始标签：按小写分组，组内取别名表指定的写法，
        // 没有别名就取出现次数最多的原始写法当展示名
        function buildTagIndex(videos) {
            const groups = new Map(); // 小写 -> Map(原始写法 -> 次数)

            videos.forEach(video => {
                (video.tags || []).forEach(raw => {
                    const t = String(raw).trim();
                    if (!t) return;
                    const lower = t.toLowerCase();
                    if (!groups.has(lower)) groups.set(lower, new Map());
                    const spellings = groups.get(lower);
                    spellings.set(t, (spellings.get(t) || 0) + 1);
                });
            });

            tagDisplayByLower = new Map();
            groups.forEach((spellings, lower) => {
                if (tagHiddenSet.has(lower)) {
                    tagDisplayByLower.set(lower, null);
                    return;
                }
                const canonical = tagAliases.canonical[lower];
                if (canonical) {
                    tagDisplayByLower.set(lower, canonical);
                    return;
                }
                let best = null;
                let bestCount = -1;
                spellings.forEach((count, spelling) => {
                    if (count > bestCount) {
                        best = spelling;
                        bestCount = count;
                    }
                });
                tagDisplayByLower.set(lower, best);
            });

            // 一个视频对同一个展示名只计一次：ns 和 switch 同时出现时不该算两个
            tagVariants = new Map();
            tagVideoCount = new Map();
            videos.forEach(video => {
                const names = new Set();
                (video.tags || []).forEach(raw => {
                    const t = String(raw).trim();
                    const name = normalizeTag(t);
                    if (!name) return;
                    if (!tagVariants.has(name)) tagVariants.set(name, new Set());
                    tagVariants.get(name).add(t);
                    names.add(name);
                });
                names.forEach(name => tagVideoCount.set(name, (tagVideoCount.get(name) || 0) + 1));
            });
        }

        function calculateTagFrequency() {
            return Array.from(tagVideoCount.entries())
                .map(([tag, count]) => ({ tag, count }))
                .sort((a, b) => b.count - a.count)
                .slice(0, 50);
        }

        function escapeRegex(text) {
            return String(text).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        // 标签列里藏了一份完整原始标签（`| a | b |`），所以按竖线包住整个标签整词匹配，
        // 把该展示名下的全部原始写法拼成一条 | 分支的正则
        function tagFilterRegex(name) {
            const variants = tagVariants.get(name);
            const list = variants ? Array.from(variants) : [name];
            const seen = new Set();
            const alternatives = [];

            list.forEach(variant => {
                const key = variant.toLowerCase();
                if (seen.has(key)) return; // DataTables 列筛选默认忽略大小写
                seen.add(key);
                alternatives.push(escapeRegex(variant));
            });
            alternatives.sort((a, b) => b.length - a.length);

            return '\\|\\s*(?:' + alternatives.join('|') + ')\\s*\\|';
        }
        
        function calculateSizeLevel(count, minFreq, maxFreq) {
            if (maxFreq === minFreq) return 4;
            
            const ratio = (count - minFreq) / (maxFreq - minFreq);
            return Math.max(1, Math.min(8, Math.ceil(ratio * 8)));
        }
        
        function calculateHeatLevel(count, minFreq, maxFreq) {
            if (maxFreq === minFreq) return 4;
            
            const ratio = (count - minFreq) / (maxFreq - minFreq);
            return Math.max(1, Math.min(8, Math.ceil(ratio * 8)));
        }
        
        function bindTagCloud() {
            // 事件委托：标签名可能带引号/反斜杠，不适合塞进内联 onclick
            $(document).on('click', '#tagCloud .cloud-tag', function () {
                filterByTag(this.getAttribute('data-tag') || '');
            });
            $(document).on('keydown', '#tagCloud .cloud-tag', function (e) {
                if (!isActivationKey(e)) return;
                e.preventDefault();
                filterByTag(this.getAttribute('data-tag') || '');
            });
        }
        
        function filterByTag(tag) {
            if (!tag) return;
            currentTagFilter = currentTagFilter === tag ? null : tag;
            
            // 清除日期筛选
            if (currentDateFilter) {
                clearDateFilter();
            }
            
            document.querySelectorAll('.cloud-tag').forEach(tagElement => {
                const tagName = tagElement.getAttribute('data-tag');
                
                if (currentTagFilter === null) {
                    tagElement.classList.remove('active', 'filtered');
                } else if (tagName === currentTagFilter) {
                    tagElement.classList.add('active');
                    tagElement.classList.remove('filtered');
                } else {
                    tagElement.classList.remove('active');
                    tagElement.classList.add('filtered');
                }
            });
            
            updateTagStats();
            filterTableByTag();
        }
        
        function clearTagFilter() {
            currentTagFilter = null;
            
            // 清除标签的视觉效果
            document.querySelectorAll('.cloud-tag').forEach(tagElement => {
                tagElement.classList.remove('active', 'filtered');
            });
            
            // 更新标签统计（currentTagFilter 已置空，「当前筛选」行会被抹掉）
            updateTagStats();

            filterTableByTag();
        }
        
        // 统计行 = 固定的「标签统计」一行 + 可选的「当前筛选」一行。
        // 取消筛选（再点一次同一个标签、或点[清除筛选]）都走这里，
        // 否则再点一次激活中的标签只会留下过期的「当前筛选」
        function updateTagStats() {
            const statsElement = document.querySelector('.tag-stats');
            if (!statsElement) return;

            const originalContent = statsElement.innerHTML.split('<br>')[0];
            if (!currentTagFilter) {
                statsElement.innerHTML = originalContent;
                return;
            }
            const count = tagVideoCount.get(currentTagFilter) || 0;
            statsElement.innerHTML = `${originalContent}<br><strong>当前筛选：</strong>${escapeHtml(currentTagFilter)} (${count} 个视频) <a href="javascript:clearTagFilter()" style="color: var(--accent-color); text-decoration: none;">[清除筛选]</a>`;
        }
        
        function filterTableByTag() {
            // 检查 DataTables 是否已经初始化
            if (!$.fn.DataTable.isDataTable('#videosTable')) {
                return;
            }
            
            const table = $('#videosTable').DataTable();
            
            // 同 filterTableByDate：全局搜索框的关键词与标签筛选取交集
            if (currentTagFilter === null) {
                table.columns().search('').draw();
            } else {
                table.columns().search(''); // 清除所有列的搜索（含时间列，标签与日期互斥）
                // 只在标签列（第3列，索引为3）进行搜索
                table.column(3).search(tagFilterRegex(currentTagFilter), true, false).draw();
            }
        }
        
        function toggleChart(chartType) {
            const elementId = chartType === 'heatmap' ? 'heatmapCalendar' : 'tagCloud';
            const container = document.getElementById(elementId)?.closest('.collapsible');
            
            if (!container) return;
            
            const willExpand = container.classList.contains('collapsed');
            
            container.classList.toggle('collapsed', !willExpand);
            saveCollapseState(chartType, !willExpand);
            document.getElementById(chartType + 'Toggle')?.setAttribute('aria-expanded', String(willExpand));
        }
        
        function saveCollapseState(chartType, isCollapsed) {
            try {
                localStorage.setItem(`chart_${chartType}_collapsed`, isCollapsed.toString());
            } catch (e) {
                console.log('无法保存折叠状态到本地存储');
            }
        }
        
        function loadCollapseStates() {
            try {
                // 热力图默认展开，标签云默认折叠
                const heatmapCollapsed = localStorage.getItem('chart_heatmap_collapsed') === 'true';
                const tagcloudCollapsed = localStorage.getItem('chart_tagcloud_collapsed') !== 'false';
                
                applyCollapseState('heatmap', 'heatmapCalendar', heatmapCollapsed);
                applyCollapseState('tagcloud', 'tagCloud', tagcloudCollapsed);
            } catch (e) {
                console.log('无法加载折叠状态');
                // 如果出错，热力图默认展开，标签云默认折叠
                applyCollapseState('tagcloud', 'tagCloud', true);
            }
        }

        // 折叠态既要写在容器的 class 上，也要同步到折叠按钮的 aria-expanded
        function applyCollapseState(chartType, elementId, isCollapsed) {
            const container = document.getElementById(elementId)?.closest('.collapsible');
            if (container) {
                container.classList.toggle('collapsed', isCollapsed);
            }
            document.getElementById(chartType + 'Toggle')?.setAttribute('aria-expanded', String(!isCollapsed));
        }
        
        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, '&amp;')
                      .replace(/</g, '&lt;')
                      .replace(/>/g, '&gt;')
                      .replace(/"/g, '&quot;')
                      .replace(/'/g, '&#039;');
        }
        
    </script>
</body>
</html>
