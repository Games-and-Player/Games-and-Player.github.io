        function filterTableByDate() {
            // 检查 DataTables 是否已经初始化
            if (!$.fn.DataTable.isDataTable('#videosTable')) {
                return;
            }
            
            const table = $('#videosTable').DataTable();
            
            // 只动列筛选，不碰 table.search()：全局搜索框里的关键词要和
            // 日期筛选取交集，否则输入框还显示着关键词、结果却已经被悄悄放大
            if (currentDateFilter === null) {
                table.columns().search('').draw();
            } else {
                // 搜索日期格式：2025-07-16 或 2025年7月16日
                const [year, month, day] = currentDateFilter.split('-');
                const searchDate = `${year}-${month.padStart(2, '0')}-${day.padStart(2, '0')}`;
                const searchDateChinese = `${year}年${parseInt(month)}月${parseInt(day)}日`;

                table.columns().search(''); // 清除所有列的搜索（含标签列，标签与日期互斥）
                // 只在时间列（第4列，索引为4）进行搜索
                table.column(4).search(`${searchDate}|${searchDateChinese}`, true, false).draw();
            }
        }
        
        let currentTagFilter = null;
        let currentDateFilter = null;
        
        function createTagCloud() {
            const tagFrequency = calculateTagFrequency();
            const tagCloudElement = document.getElementById('tagCloud');
            
            if (tagFrequency.length === 0) {
                tagCloudElement.innerHTML = '<div class="tag-cloud-loading"><span>暂无标签数据</span></div>';
                return;
            }
            
            const maxFreq = Math.max(...tagFrequency.map(t => t.count));
            const minFreq = Math.min(...tagFrequency.map(t => t.count));
            
            const expanded = tagCloudElement.classList.contains('is-expanded');
            const tagElements = tagFrequency.map((tagData, index) => {
                const { tag, count } = tagData;
                const heatLevel = calculateHeatLevel(count, minFreq, maxFreq);
                const extra = index >= TAG_CLOUD_VISIBLE ? ' cloud-tag--extra' : '';

                return `<span class="cloud-tag heat-${heatLevel}${extra}"
                              data-tag="${escapeHtml(tag)}" 
                              data-count="${count}"
                              role="button" tabindex="0"
                              title="${escapeHtml(tag)} (${count} 个视频)">
                            ${escapeHtml(tag)}
                        </span>`;
            }).join('');

            const hiddenCount = Math.max(0, tagFrequency.length - TAG_CLOUD_VISIBLE);
            const moreHtml = hiddenCount
                ? `<button type="button" class="cloud-more" aria-expanded="${expanded}">${expanded ? '收起' : `更多 (+${hiddenCount})`}</button>`
                : '';
            
            const statsHtml = `
                <div class="tag-stats">
                    共 ${tagVideoCount.size} 个标签，显示前 ${tagFrequency.length} 个
                    ${currentTagFilter ? `<br><strong>当前筛选：</strong>${escapeHtml(currentTagFilter)} <a href="javascript:clearTagFilter()" style="color: var(--accent-color); text-decoration: none;">[清除筛选]</a>` : ''}
                </div>
            `;
            
            tagCloudElement.innerHTML = tagElements + moreHtml + statsHtml;
        }
        
        // ===== 标签归一化 =====
        // canonical: 小写原始写法 -> 展示名；hidden: 频道通用标签，不进标签云
        let tagAliases = { canonical: {}, hidden: [] };
        let tagHiddenSet = new Set();      // 小写
        let tagDisplayByLower = new Map(); // 小写 -> 展示名，隐藏标签为 null
        let tagVariants = new Map();       // 展示名 -> Set(出现过的原始写法)
        let tagVideoCount = new Map();     // 展示名 -> 含该标签的视频数

        function setTagAliases(aliases) {
            tagAliases = {
                canonical: (aliases && aliases.canonical) || {},
                hidden: (aliases && aliases.hidden) || []
            };
            tagHiddenSet = new Set(tagAliases.hidden.map(tag => String(tag).trim().toLowerCase()));
        }

        function normalizeTag(tag) {
            const t = String(tag == null ? '' : tag).trim();
            if (!t) return null;
            const lower = t.toLowerCase();
            if (tagHiddenSet.has(lower)) return null;
            if (tagDisplayByLower.has(lower)) return tagDisplayByLower.get(lower);
            return tagAliases.canonical[lower] || t;
        }

        // 预先统计全部原始标签：按小写分组，组内取别名表指定的写法，
        // 没有别名就取出现次数最多的原始写法当展示名
        function buildTagIndex(videos) {
            const groups = new Map(); // 小写 -> Map(原始写法 -> 次数)

            videos.forEach(video => {
                (video.tags || []).forEach(raw => {
                    const t = String(raw).trim();
                    if (!t) return;
                    const lower = t.toLowerCase();
                    if (!groups.has(lower)) groups.set(lower, new Map());
                    const spellings = groups.get(lower);
                    spellings.set(t, (spellings.get(t) || 0) + 1);
                });
            });

            tagDisplayByLower = new Map();
            groups.forEach((spellings, lower) => {
                if (tagHiddenSet.has(lower)) {
                    tagDisplayByLower.set(lower, null);
                    return;
                }
                const canonical = tagAliases.canonical[lower];
                if (canonical) {
                    tagDisplayByLower.set(lower, canonical);
                    return;
                }
                let best = null;
                let bestCount = -1;
                spellings.forEach((count, spelling) => {
                    if (count > bestCount) {
                        best = spelling;
                        bestCount = count;
                    }
                });
                tagDisplayByLower.set(lower, best);
            });

            // 一个视频对同一个展示名只计一次：ns 和 switch 同时出现时不该算两个
            tagVariants = new Map();
            tagVideoCount = new Map();
            videos.forEach(video => {
                const names = new Set();
                (video.tags || []).forEach(raw => {
                    const t = String(raw).trim();
                    const name = normalizeTag(t);
                    if (!name) return;
                    if (!tagVariants.has(name)) tagVariants.set(name, new Set());
                    tagVariants.get(name).add(t);
                    names.add(name);
                });
                names.forEach(name => tagVideoCount.set(name, (tagVideoCount.get(name) || 0) + 1));
            });
        }

        // 标签云：按视频数取前 TAG_CLOUD_MAX 个进候选，默认只露出前 TAG_CLOUD_VISIBLE 个，
        // 其余藏在「更多」后面（展开状态记在 #tagCloud 的 is-expanded 类上，重绘不丢）
        const TAG_CLOUD_MAX = 200;
        const TAG_CLOUD_VISIBLE = 60;

        function calculateTagFrequency() {
            return Array.from(tagVideoCount.entries())
                .map(([tag, count]) => ({ tag, count }))
                .sort((a, b) => b.count - a.count)
                .slice(0, TAG_CLOUD_MAX);
        }

        function escapeRegex(text) {
            return String(text).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        // 标签列里藏了一份完整原始标签（`| a | b |`），所以按竖线包住整个标签整词匹配，
        // 把该展示名下的全部原始写法拼成一条 | 分支的正则
        function tagFilterRegex(name) {
            const variants = tagVariants.get(name);
            const list = variants ? Array.from(variants) : [name];
            const seen = new Set();
            const alternatives = [];

            list.forEach(variant => {
                const key = variant.toLowerCase();
                if (seen.has(key)) return; // DataTables 列筛选默认忽略大小写
                seen.add(key);
                alternatives.push(escapeRegex(variant));
            });
            alternatives.sort((a, b) => b.length - a.length);

            return '\\|\\s*(?:' + alternatives.join('|') + ')\\s*\\|';
        }
        
        function calculateHeatLevel(count, minFreq, maxFreq) {
            if (maxFreq === minFreq) return 4;
            
            const ratio = (count - minFreq) / (maxFreq - minFreq);
            return Math.max(1, Math.min(8, Math.ceil(ratio * 8)));
        }
        
        function bindTagCloud() {
            // 事件委托：标签名可能带引号/反斜杠，不适合塞进内联 onclick
            $(document).on('click', '#tagCloud .cloud-tag', function () {
                filterByTag(this.getAttribute('data-tag') || '');
            });
            $(document).on('keydown', '#tagCloud .cloud-tag', function (e) {
                if (!isActivationKey(e)) return;
                e.preventDefault();
                filterByTag(this.getAttribute('data-tag') || '');
            });
            // 「更多 / 收起」：只切 #tagCloud 上的类，标签本身不重绘
            $(document).on('click', '#tagCloud .cloud-more', function () {
                const cloud = document.getElementById('tagCloud');
                const expanded = cloud.classList.toggle('is-expanded');
                const hiddenCount = cloud.querySelectorAll('.cloud-tag--extra').length;
                this.setAttribute('aria-expanded', String(expanded));
                this.textContent = expanded ? '收起' : `更多 (+${hiddenCount})`;
            });
        }
        
        function filterByTag(tag) {
            if (!tag) return;
            currentTagFilter = currentTagFilter === tag ? null : tag;
            
            // 清除日期筛选
            if (currentDateFilter) {
                clearDateFilter();
            }
            
            document.querySelectorAll('.cloud-tag').forEach(tagElement => {
                const tagName = tagElement.getAttribute('data-tag');
                
                if (currentTagFilter === null) {
                    tagElement.classList.remove('active', 'filtered');
                } else if (tagName === currentTagFilter) {
                    tagElement.classList.add('active');
                    tagElement.classList.remove('filtered');
                } else {
                    tagElement.classList.remove('active');
                    tagElement.classList.add('filtered');
                }
            });
            
            updateTagStats();
            filterTableByTag();
        }
        
        function clearTagFilter() {
            currentTagFilter = null;
            
            // 清除标签的视觉效果
            document.querySelectorAll('.cloud-tag').forEach(tagElement => {
                tagElement.classList.remove('active', 'filtered');
            });
            
            // 更新标签统计（currentTagFilter 已置空，「当前筛选」行会被抹掉）
            updateTagStats();

            filterTableByTag();
        }
        
        // 统计行 = 固定的「标签统计」一行 + 可选的「当前筛选」一行。
        // 取消筛选（再点一次同一个标签、或点[清除筛选]）都走这里，
        // 否则再点一次激活中的标签只会留下过期的「当前筛选」
        function updateTagStats() {
            const statsElement = document.querySelector('.tag-stats');
            if (!statsElement) return;

            const originalContent = statsElement.innerHTML.split('<br>')[0];
            if (!currentTagFilter) {
                statsElement.innerHTML = originalContent;
                return;
            }
            const count = tagVideoCount.get(currentTagFilter) || 0;
            statsElement.innerHTML = `${originalContent}<br><strong>当前筛选：</strong>${escapeHtml(currentTagFilter)} (${count} 个视频) <a href="javascript:clearTagFilter()" style="color: var(--accent-color); text-decoration: none;">[清除筛选]</a>`;
        }
        
        function filterTableByTag() {
            // 检查 DataTables 是否已经初始化
            if (!$.fn.DataTable.isDataTable('#videosTable')) {
                return;
            }
            
            const table = $('#videosTable').DataTable();
            
            // 同 filterTableByDate：全局搜索框的关键词与标签筛选取交集
            if (currentTagFilter === null) {
                table.columns().search('').draw();
            } else {
                table.columns().search(''); // 清除所有列的搜索（含时间列，标签与日期互斥）
                // 只在标签列（第3列，索引为3）进行搜索
                table.column(3).search(tagFilterRegex(currentTagFilter), true, false).draw();
            }
        }
        
        function toggleChart(chartType) {
            const elementId = chartType === 'heatmap' ? 'heatmapCalendar' : chartType === 'today' ? 'todayList' : 'tagCloud';
            const container = document.getElementById(elementId)?.closest('.collapsible');
            
            if (!container) return;
            // 侧栏在宽屏永远展开，点标题不能动折叠状态，否则会把错误的状态存进 localStorage 带回窄屏
            if (WIDE_MQ.matches && container.closest('.side')) return;

            const willExpand = container.classList.contains('collapsed');
            
            container.classList.toggle('collapsed', !willExpand);
            saveCollapseState(chartType, !willExpand);
            document.getElementById(chartType + 'Toggle')?.setAttribute('aria-expanded', String(willExpand));
            syncSectionBarBtn(chartType, willExpand);
        }

        function saveCollapseState(chartType, isCollapsed) {
            try {
                localStorage.setItem(`chart_${chartType}_collapsed`, isCollapsed.toString());
            } catch (e) {
                console.log('无法保存折叠状态到本地存储');
            }
        }

        function loadCollapseStates() {
            try {
                // 窄屏按钮行取代卡头后三块默认都折叠；宽屏侧栏永远展开的覆盖不受影响
                const heatmapCollapsed = localStorage.getItem('chart_heatmap_collapsed') !== 'false';
                const tagcloudCollapsed = localStorage.getItem('chart_tagcloud_collapsed') !== 'false';
                const todayCollapsed = localStorage.getItem('chart_today_collapsed') !== 'false';

                applyCollapseState('heatmap', 'heatmapCalendar', heatmapCollapsed);
                applyCollapseState('tagcloud', 'tagCloud', tagcloudCollapsed);
                applyCollapseState('today', 'todayList', todayCollapsed);
            } catch (e) {
                console.log('无法加载折叠状态');
                // 如果出错，三块都默认折叠
                applyCollapseState('heatmap', 'heatmapCalendar', true);
                applyCollapseState('tagcloud', 'tagCloud', true);
                applyCollapseState('today', 'todayList', true);
            }
        }

        // 折叠态既要写在容器的 class 上，也要同步到折叠按钮和窄屏按钮行对应按钮的 aria-expanded
        function applyCollapseState(chartType, elementId, isCollapsed) {
            const container = document.getElementById(elementId)?.closest('.collapsible');
            if (container) {
                container.classList.toggle('collapsed', isCollapsed);
            }
            document.getElementById(chartType + 'Toggle')?.setAttribute('aria-expanded', String(!isCollapsed));
            syncSectionBarBtn(chartType, !isCollapsed);
        }

        // 按钮行（<1440）上对应按钮的展开态：aria-expanded + 高亮样式
        function syncSectionBarBtn(chartType, isOpen) {
            const btn = document.querySelector(`.section-bar__btn[data-chart="${chartType}"]`);
            if (!btn) return;
            btn.setAttribute('aria-expanded', String(isOpen));
            btn.classList.toggle('is-open', isOpen);
        }
        
        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, '&amp;')
                      .replace(/</g, '&lt;')
                      .replace(/>/g, '&gt;')
                      .replace(/"/g, '&quot;')
                      .replace(/'/g, '&#039;');
        }

    </script>
    <button type="button" class="side-pager side-pager--prev" id="sidePrev" aria-label="上一页" tabindex="-1" hidden>‹</button>
    <button type="button" class="side-pager side-pager--next" id="sideNext" aria-label="下一页" tabindex="-1" hidden>›</button>
</body>
