<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宋少弘（原游戏公民大会）视频投稿存档</title>
    <link rel="icon" type="image/png" href="favicon.png">

    <meta name="description" content="宋少弘（原游戏公民大会）B站投稿存档：收录 2016 年至今的全部投稿，包括已删除视频的标题、简介、标签与补档信息，每日自动更新。">
    <link rel="canonical" href="https://games-and-player.github.io/">
    <meta property="og:type" content="website">
    <meta property="og:title" content="宋少弘（原游戏公民大会）视频投稿存档">
    <meta property="og:description" content="收录 2016 年至今的全部投稿，包括已删除视频的标题、简介、标签与补档信息。">
    <meta property="og:url" content="https://games-and-player.github.io/">
    <meta property="og:image" content="https://games-and-player.github.io/favicon.png">

    <!-- DataTables CSS -->
    <link rel="stylesheet" href="static/vendor/dataTables.bootstrap4-1.10.21.min.css">
    <link rel="stylesheet" href="static/vendor/bootstrap-4.6.0.min.css">
    
    <style>
        /* ── 设计令牌（台账皮肤）────────────────────────────────────────────
           浅色为基准，深色只重定义令牌本身，组件规则一律走 var()。
           --*-rgb 供需要透明度的地方拼 rgba()，--on-accent 是填充 --accent
           时的文字色（浅色下是白、深色下是近黑），保证两套主题都够对比。 */
        :root {
            color-scheme: light dark;

            --bg: #F3F5F7;
            --surface: #FFFFFF;
            --ink: #14202B;
            --ink-2: #4A5866;
            --ink-3: #8593A0;
            --line: #D9DFE5;
            --accent: #1F4E9C;
            --accent-rgb: 31, 78, 156;
            --bg-rgb: 243, 245, 247;
            --ink-rgb: 20, 32, 43;
            --on-accent: #FFFFFF;
            /* 签条底色是 --lost / --backup，浅色下是深底配白字，深色下是亮底配暗字 */
            --ribbon-ink: #FFFFFF;
            --ok: #0B7A58;
            --backup: #7A4EB5;
            --hidden: #6B7785;
            --lost: #C2362B;
            --stripe: rgba(20, 32, 43, 0.028);
            --row-hover: rgba(31, 78, 156, 0.06);
            --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

            /* 兼容旧变量名 */
            --accent-color: var(--accent);
            --accent-color-soft: rgba(31, 78, 156, 0.12);
            --text-color: var(--ink);
            --muted-color: var(--ink-2);
            --border-color: var(--line);
            --surface-color: var(--surface);
            --surface-muted: var(--bg);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0F151B;
                --surface: #161E26;
                --ink: #E6EBF0;
                --ink-2: #A7B3BE;
                --ink-3: #6F7C88;
                --line: #26313C;
                --accent: #7FA6E8;
                --accent-rgb: 127, 166, 232;
                --bg-rgb: 15, 21, 27;
                --ink-rgb: 230, 235, 240;
                --on-accent: #0F151B;
                --ribbon-ink: #0F151B;
                --ok: #20A392;
                --backup: #977DDE;
                --hidden: #8A96A3;
                --lost: #E0665A;
                --stripe: rgba(230, 235, 240, 0.035);
                --row-hover: rgba(127, 166, 232, 0.10);
                --accent-color-soft: rgba(127, 166, 232, 0.16);
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            position: relative;

            font-family: 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(circle, rgba(var(--ink-rgb), .07) 1px, transparent 1.3px);
            background-size: 22px 22px;
            color: var(--ink);
            min-height: 100vh;
            margin: 0;
            padding: 32px 0;
            overflow-x: hidden;
        }

        /* 台账的数字一律等宽 + 定宽数位，纵向能对齐 */
        .num,
        .stat-number,
        .date-cell,
        .number-cell,
        .chip b {
            font-family: var(--mono);
            font-variant-numeric: tabular-nums;
        }

        .container-fluid {
            max-width: 1120px;
            margin: 0 auto;
            padding: 0 24px;
            overflow-x: hidden;
        }

        /* 页眉封面带：往年同期投稿的封面，绝对定位在 .header 内，
           z-index: -1 沉在标题下面，纯装饰用 aria-hidden 挡在无障碍树外 */
        .hero-band {
            position: absolute;
            inset: 0 0 auto 0;
            z-index: -1;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 8px;
            padding: 0 8px;
            overflow: hidden;
            pointer-events: none;
            opacity: .42;
            -webkit-mask-image: linear-gradient(180deg, #000 0%, rgba(0, 0, 0, .9) 45%, transparent 100%);
            mask-image: linear-gradient(180deg, #000 0%, rgba(0, 0, 0, .9) 45%, transparent 100%);
        }

        .hero-band__tile {
            aspect-ratio: 16 / 10;
            border-radius: 8px;
            overflow: hidden;
            background: rgba(var(--accent-rgb), .12);
        }

        .hero-band__tile img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: saturate(.85);
        }

        .hero-band__tile--deleted img {
            filter: grayscale(.6) saturate(.85);
        }

        .hero-caption {
            margin: 6px 0 0;
            font-size: .78rem;
            color: var(--ink-3);
        }

        @media (max-width: 767px) {
            .hero-band {
                grid-template-columns: repeat(4, 1fr);
                opacity: .36;
            }
            .hero-band__tile:nth-child(n + 5) {
                display: none;
            }
            .header {
                padding-top: 60px;
            }
            .hero-caption__years {
                display: none;
            }
        }


        .header {
            position: relative;
            z-index: 0;
            text-align: center;
            margin-bottom: 32px;
            padding-top: 88px;
        }

        /* flex 让图标与标题之间只留一个受控的 gap，
           不再受标签间空白文本节点的影响 */
        .header h1 {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 0 0 8px;
            font-size: 2rem;
            font-weight: 700;
        }

        .header h1 .icon,
        .chart-header h3 .icon {
            flex: none;
            color: var(--accent);
        }

        .header p {
            margin: 0;
            color: var(--muted-color);
            font-size: 1rem;
        }

        .stats-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }

        /* 卡片只有一条发丝边，不投影 */
        .stat-card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 16px 18px;
            box-shadow: none;
        }

        .stat-number {
            display: block;
            font-size: 1.8rem;
            font-weight: 600;
            line-height: 1.2;
            color: var(--accent);
        }

        .stat-note {
            font-size: 0.7rem;
            color: var(--ink-2);
            margin-top: 4px;
        }

        .stat-label {
            color: var(--ink-2);
            font-size: 0.85rem;
            margin-top: 6px;
        }

        .stat-number.is-date {
            font-size: 1.2rem;
            line-height: 1.8;
        }

        .survival {
            display: flex;
            gap: 2px;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            background: var(--border-color);
            margin: -16px 0 32px;
        }

        .survival > span {
            display: block;
        }

        .survival__ok { background: var(--ok); }
        .survival__backup { background: var(--backup); }
        .survival__hidden { background: var(--hidden); }
        .survival__lost { background: var(--lost); }

        .survival-legend {
            font-size: 0.78rem;
            color: var(--muted-color);
            text-align: center;
            margin: -24px 0 32px;
        }

        .table-container,
        .chart-container {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 32px;
        }

        /* 表格自身滚动：DataTables 渲染后表格宽度由列宽撑开，
           容器负责横向滚动，避免页面整体横向溢出 */
        .table-scroll {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .status-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }

        /* ── 表格 / 卡片：工具条与视图切换 ────────────────────────────────
           .table-toolbar 一行两端：左边状态 chips，右边视图切换组；
           空间不够时整组换行，靠 margin-left:auto 继续贴右。 */
        .table-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 16px;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        /* 下外边距交给工具条，免得工具条内部多出一截空白 */
        .table-toolbar .status-chips {
            margin-bottom: 0;
            min-width: 0;
        }

        .toolbar-tools {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-left: auto;
        }

        .duration-filter {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin: 0;
            font-size: .8rem;
            color: var(--ink-2);
        }

        .card-sort select,
        .duration-filter select {
            width: auto;
            font-size: .8rem;
        }

        .view-toggle {
            display: inline-flex;
            border: 1px solid var(--line);
            border-radius: 999px;
            overflow: hidden;
            flex: none;
        }

        .view-btn {
            border: 0;
            background: var(--surface);
            color: var(--ink-2);
            padding: 4px 12px;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .view-btn.active {
            background: var(--accent);
            color: var(--on-accent);
        }

        /* ── 卡片视图 ──────────────────────────────────────────────────
           卡片模式下只把表格本体收起来，DataTables 的搜索/信息/分页照常。 */
        body.view-cards .table-scroll {
            display: none;
        }

        /* 每页 24 张不在 lengthMenu 里，长度下拉在卡片模式下会显示成空白，
           索性收起来；卡片模式的排序由 .card-sort 负责 */
        body.view-cards #videosTable_wrapper .dataTables_length {
            display: none;
        }

        .card-sort {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0 0 12px;
            font-size: 0.85rem;
            color: var(--ink-2);
        }

        .card-sort label {
            margin: 0;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
        }

        .card-grid__empty {
            grid-column: 1 / -1;
            padding: 32px 0;
            text-align: center;
            color: var(--ink-3);
            margin: 0;
        }

        /* 作者样式里的 display 会盖掉 UA 的 [hidden]，这里把它拿回来 */
        .card-grid[hidden],
        .card-sort[hidden] {
            display: none;
        }

        .vcard {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: border-color .15s;
        }

        .vcard:hover { border-color: var(--ink-3); }

        .vcard__cover { position: relative; }

        /* 已删除/仅自见的封面先褪色，hover 时还原 */
        .vcard--lost .vcard__cover img,
        .vcard--hidden .vcard__cover img { filter: grayscale(.6); transition: filter .2s; }

        .vcard--lost:hover .vcard__cover img,
        .vcard--hidden:hover .vcard__cover img { filter: none; }

        .vcard__ribbon {
            position: absolute;
            top: 0;
            left: 0;
            font-family: var(--mono);
            font-size: 10.5px;
            color: var(--ribbon-ink);
            padding: 2px 8px;
            border-bottom-right-radius: 6px;
        }

        .vcard__ribbon--lost { background: var(--lost); }
        .vcard__ribbon--backup { background: var(--backup); }

        .vcard__body {
            padding: 12px 14px 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .vcard__title {
            font-weight: 600;
            font-size: 0.95rem;
            line-height: 1.4;
            color: var(--ink);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .vcard--lost .vcard__title,
        .vcard--hidden .vcard__title,
        .vcard--backup .vcard__title { color: var(--ink-2); }

        .vcard__title:hover { color: var(--accent); text-decoration: none; }

        .vcard__meta { font-size: 0.75rem; color: var(--ink-3); }

        .vcard .stamp { margin: 0; }

        /* 表格里封面是 80×60 缩略图，卡片里改成整幅 16:10 顶图 */
        .vcard .cover-container {
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 10;
            border: 0;
            border-radius: 8px 8px 0 0;
        }

        .vcard .video-cover { width: 100%; height: 100%; object-fit: cover; }

        /* 表格里那 1.75 倍的放大预览在整幅封面上没必要 */
        .vcard .video-cover:hover { transform: none; }

        /* 描述与标签在表格里限宽 220px，卡片里跟着卡片走 */
        .vcard .video-desc,
        .vcard .tags-container { max-width: none; }

        @media (max-width: 480px) {
            .card-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .vcard__body { padding: 10px; }
        }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 14px;
            font-size: 0.85rem;
            color: var(--muted-color);
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 999px;
            cursor: pointer;
            transition: color 0.15s ease, border-color 0.15s ease, background-color 0.15s ease;
        }

        .chip:hover:not(.active) {
            color: var(--accent);
            border-color: var(--accent);
        }

        .chip.active {
            color: var(--on-accent);
            background: var(--accent);
            border-color: var(--accent);
        }

        .chip .num {
            font-weight: 600;
        }

        .chart-container.collapsible .chart-header {
            margin-bottom: 16px;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .chart-header:hover {
            color: var(--accent-color);
        }

        .chart-header h3 {
            margin: 0;
            font-size: 1.3rem;
        }

        .chart-header p {
            margin: 4px 0 0;
            font-size: 0.9rem;
            color: var(--muted-color);
        }

        .collapse-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            padding: 0;
            border: 0;
            border-radius: 50%;
            background: none;
            color: var(--muted-color);
            cursor: pointer;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .collapse-btn:hover {
            background-color: var(--accent-color-soft);
            color: var(--accent-color);
        }

        .collapsible .chart-content,
        .collapsible .tag-cloud {
            transition: max-height 0.3s ease, opacity 0.3s ease, padding 0.3s ease;
        }

        .collapsible.collapsed .chart-content,
        .collapsible.collapsed .tag-cloud {
            max-height: 0;
            opacity: 0;
            padding-top: 0;
            padding-bottom: 0;
            pointer-events: none;
            visibility: hidden; /* 折叠后的可聚焦元素退出 Tab 序列 */
            overflow: hidden;
        }

        .collapsible.collapsed .collapse-btn .icon {
            transform: rotate(180deg);
        }

        .video-title {
            max-width: 320px;
        }

        .video-title a {
            color: inherit;
            text-decoration: none;
        }

        .video-title a:hover {
            color: var(--accent-color);
        }

        .video-title.unavailable > a {
            color: var(--ink-2) !important;
        }

        /* 状态章只出现在标题列，单独占一行，避免跟着标题末尾折行 */
        .stamp {
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 4px 0 0;
            font-size: 0.72rem;
            color: var(--ink-2);
            white-space: nowrap;
        }

        .stamp i {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
            flex: none;
        }

        .stamp a,
        .stamp a:hover {
            color: inherit;
            text-decoration: underline dotted;
        }

        .stamp--available { color: var(--ok); }
        .stamp--backup { color: var(--backup); }
        .stamp--hidden { color: var(--hidden); }
        .stamp--lost { color: var(--lost); }

        .cover-container {
            width: 80px;
            height: 60px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            background: var(--surface-muted);
        }

        .video-cover {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.2s ease;
            cursor: pointer;
        }

        .video-cover:hover {
            transform: scale(1.75);
            z-index: 10;
        }

        .cover-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--muted-color);
            font-size: 1.4rem;
            background: var(--surface-muted);
        }

        .video-desc {
            max-width: 220px;
            max-height: 60px;
            overflow: hidden;
            font-size: 0.85rem;
            color: var(--muted-color);
            cursor: pointer;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .video-desc:hover {
            background: var(--surface-muted);
            border-radius: 6px;
        }

        .video-desc.expanded {
            max-height: none;
            overflow: visible;
            -webkit-line-clamp: unset;
            color: var(--text-color);
            background: var(--surface-muted);
            border-radius: 6px;
        }

        .tags-container {
            max-width: 220px;
        }

        .tag {
            display: inline-block;
            background: var(--accent-color-soft);
            color: var(--accent-color);
            padding: 4px 10px;
            border-radius: 999px;
            margin: 2px;
            font-size: 0.75rem;
        }

        .tag-more {
            cursor: pointer;
        }

        .copy-btn {
            display: inline-block;
            margin-top: 6px;
            padding: 2px 8px;
            font-size: 0.72rem;
            line-height: 1.4;
            color: var(--muted-color);
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
        }

        .copy-btn:hover {
            color: var(--accent-color);
            border-color: var(--accent-color);
        }

        .copy-btn.copied {
            color: var(--ok);
            border-color: var(--ok);
        }

        .copy-btn.failed {
            color: var(--lost);
            border-color: var(--lost);
        }

        /* ── 表格与第三方组件（Bootstrap / DataTables）改吃设计令牌 ──
           这些组件的颜色都写死在 vendor CSS 里，深色模式下不覆盖就会
           出现黑字黑底 / 白底刺眼条纹，所以在这里统一接回 var()。 */
        .table {
            color: var(--ink);
            border-color: var(--line);
        }

        .table th,
        .table td {
            border-top: 1px solid var(--line);
        }

        /* 表头不用 Bootstrap 自带的深色块，改成台账式浅表头，两套主题一致 */
        #videosTable thead th {
            background: var(--surface);
            color: var(--ink-2);
            font-weight: 500;
            font-size: 0.8rem;
            letter-spacing: 0.02em;
            border-top: 0;
            border-bottom: 1px solid var(--line);
        }

        .table-striped tbody tr:nth-of-type(odd) {
            background-color: var(--stripe);
        }

        .table-hover tbody tr:hover {
            color: var(--ink);
            background-color: var(--row-hover);
        }

        .date-cell,
        .number-cell {
            font-size: 0.85rem;
            color: var(--ink-2);
        }

        .number-cell {
            text-align: right;
        }

        .text-muted {
            color: var(--ink-2) !important;
        }

        .form-control,
        .custom-select {
            color: var(--ink);
            background-color: var(--surface);
            border-color: var(--line);
        }

        .form-control:focus,
        .custom-select:focus {
            color: var(--ink);
            background-color: var(--surface);
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent-color-soft);
        }

        .form-control::placeholder {
            color: var(--ink-3);
        }

        #videosTable_wrapper .dataTables_filter input,
        #videosTable_wrapper .dataTables_length select {
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 6px 12px;
            background-color: var(--surface);
            color: var(--ink);
        }

        /* select 右侧要给下拉箭头留位置 */
        #videosTable_wrapper .dataTables_length select {
            padding-right: 28px;
        }

        #videosTable_wrapper .dataTables_info,
        #videosTable_wrapper .dataTables_length,
        #videosTable_wrapper .dataTables_filter,
        #videosTable_wrapper .dataTables_processing {
            color: var(--ink-2);
            font-size: 0.85rem;
        }

        .page-link {
            color: var(--accent);
            background-color: var(--surface);
            border-color: var(--line);
        }

        .page-link:hover {
            color: var(--accent);
            background-color: var(--bg);
            border-color: var(--line);
        }

        .page-item.active .page-link {
            color: var(--on-accent);
            background-color: var(--accent);
            border-color: var(--accent);
        }

        .page-item.disabled .page-link {
            color: var(--ink-3);
            background-color: var(--surface);
            border-color: var(--line);
        }

        /* ── 封面灯箱：对话框按图片宽度收窄，图下一条信息栏；舞台在两套主题里恒为深色，故用字面色 ── */
        .lightbox.modal .modal-dialog { max-width: min(92vw, 1120px); margin: 1rem auto; transition: transform 0.3s ease-out, max-width 0.15s ease; }
        .lightbox .modal-content { background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
        .lightbox-stage { position: relative; background: #0b0f14; display: flex; align-items: center; justify-content: center; min-height: 160px; }
        .lightbox-stage img { display: block; width: 100%; height: auto; max-height: 76vh; object-fit: contain; }
        .lightbox-close { position: absolute; top: 10px; right: 10px; z-index: 2; width: 36px; height: 36px; padding: 0; border: 0; border-radius: 50%; background: rgba(0, 0, 0, 0.55); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; }
        .lightbox-close:hover, .lightbox-close:focus-visible { background: rgba(0, 0, 0, 0.85); }
        .lightbox-error { display: none; padding: 48px 24px; text-align: center; color: #cbd5e1; }
        .lightbox-error .icon { font-size: 2.4rem; margin-bottom: 10px; }
        .lightbox-error p { margin: 0 0 4px; }
        .lightbox-error small { color: #94a3b8; }
        .lightbox-caption { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding: 14px 18px 16px; }
        .lightbox-caption__main { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
        .lightbox-title { font-weight: 600; font-size: 1.02rem; line-height: 1.4; color: var(--ink); text-decoration: none; }
        .lightbox-title:hover { color: var(--accent); text-decoration: none; }
        .lightbox-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.8rem; color: var(--ink-3); }
        .lightbox-meta span:empty { display: none; }
        .lightbox-actions { display: flex; flex-wrap: wrap; gap: 8px; flex: none; justify-content: flex-end; max-width: 46%; }
        .lightbox-actions .copy-btn { margin-top: 0; }
        .lightbox-actions a.copy-btn { text-decoration: none; }
        @media (max-width: 768px) {
            .lightbox .modal-dialog { margin: 0.5rem; max-width: none; }
            .lightbox-stage img { max-height: 60vh; }
            .lightbox-caption { flex-direction: column; }
            .lightbox-actions { max-width: none; justify-content: flex-start; }
        }

        /* 键盘焦点：新加的可聚焦元素统一用主色描边 */
        .cloud-tag:focus-visible, .heatmap-day[tabindex]:focus-visible, .tag-more:focus-visible, .chip:focus-visible,
        .copy-btn:focus-visible, .collapse-btn:focus-visible, .cover-container:focus-visible, .lightbox-close:focus-visible,
        .btn-link-like:focus-visible, .view-btn:focus-visible, #cardSortSelect:focus-visible,
        #durationSelect:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .loading {
            text-align: center;
            padding: 48px 0;
            color: var(--muted-color);
        }

        .loading .icon {
            font-size: 2.5rem;
            margin-bottom: 12px;
        }

        .error {
            border-radius: 12px;
            padding: 16px;
            background: var(--surface);
            border: 1px solid var(--lost);
            color: var(--lost);
        }

        .tag-cloud {
            min-height: 220px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            padding: 16px;
        }

        .tag-cloud-loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            color: var(--muted-color);
        }

        .tag-cloud-loading .icon {
            font-size: 1.6rem;
        }

        .cloud-tag {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 6px 14px;
            border-radius: 999px;
            border: 1px solid transparent;
            background: var(--bg);
            color: var(--ink);
            font-size: 0.85rem;
            cursor: pointer;
            transition: border-color 0.2s ease, background-color 0.2s ease, opacity 0.2s ease;
        }

        /* 悬停只动描边：热度高的标签是实心 accent 底，
           再改文字色就会糊成一片 */
        .cloud-tag:hover {
            border-color: var(--accent);
        }

        .cloud-tag.filtered {
            opacity: 0.35;
        }

        .cloud-tag.size-1 { font-size: 0.75rem; }
        .cloud-tag.size-2 { font-size: 0.8rem; }
        .cloud-tag.size-3 { font-size: 0.9rem; }
        .cloud-tag.size-4 { font-size: 1rem; }
        .cloud-tag.size-5 { font-size: 1.2rem; }
        .cloud-tag.size-6 { font-size: 1.35rem; }
        .cloud-tag.size-7 { font-size: 1.5rem; }
        .cloud-tag.size-8 { font-size: 1.7rem; }

        /* 热度靠 accent 底色的浓淡表达；淡底配 --ink，浓底配 --on-accent，
           两套主题下都是高对比 */
        .cloud-tag.heat-2 { background: rgba(var(--accent-rgb), 0.10); }
        .cloud-tag.heat-3 { background: rgba(var(--accent-rgb), 0.16); }
        .cloud-tag.heat-4 { background: rgba(var(--accent-rgb), 0.24); }
        .cloud-tag.heat-5 { background: rgba(var(--accent-rgb), 0.34); }
        .cloud-tag.heat-6 { background: rgba(var(--accent-rgb), 0.78); color: var(--on-accent); }
        .cloud-tag.heat-7 { background: rgba(var(--accent-rgb), 0.90); color: var(--on-accent); }
        .cloud-tag.heat-8 { background: var(--accent); color: var(--on-accent); }

        /* 必须排在 heat-* 之后：同权重下靠源序取胜，否则选中态会被热度底色盖掉 */
        .cloud-tag.active {
            background: var(--accent);
            color: var(--on-accent);
            border-color: var(--accent);
        }

        .tag-stats {
            width: 100%;
            text-align: center;
            color: var(--muted-color);
            font-size: 0.9rem;
            margin-top: 16px;
        }

        .tag-stats a {
            color: var(--accent-color);
            text-decoration: none;
        }

        .tag-stats a:hover {
            text-decoration: underline;
        }

        .heatmap-container {
            overflow-x: auto;
        }

        .heatmap-calendar {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .heatmap-legend {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px 16px;
            font-size: 0.85rem;
            color: var(--muted-color);
        }

        .heatmap-legend-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .heatmap-year {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .heatmap-year-title {
            font-weight: 600;
            color: var(--muted-color);
            font-size: 0.95rem;
        }

        .heatmap-months {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 2px;
            font-size: 0.7rem;
            color: var(--muted-color);
        }

        .heatmap-days {
            display: grid;
            grid-template-columns: repeat(53, 1fr);
            gap: 2px;
        }

        .heatmap-day {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 2px;
            background: var(--line);
            transition: transform 0.1s ease, border 0.1s ease;
        }

        .heatmap-day:hover {
            transform: scale(1.2);
            border: 1px solid var(--accent-color);
        }

        .heatmap-day.has-videos {
            cursor: pointer;
        }

        /* 日格状态色。day-none 用 --line 而不是 --bg：
           日历卡片本身是 --surface，用 --bg 在卡片上几乎看不见 */
        .heatmap-day.day-none { background: var(--line); }
        .heatmap-day.day-ok { background: var(--ok); }
        .heatmap-day.day-backup { background: var(--backup); }
        .heatmap-day.day-lost { background: var(--lost); }
        .heatmap-day.day-hidden { background: var(--hidden); }
        .heatmap-day.day-mixed { background: linear-gradient(135deg, var(--ok) 50%, var(--lost) 50%); }

        .heatmap-day.selected {
            outline: 2px solid var(--accent);
        }

        .heatmap-tooltip {
            position: absolute;
            background: var(--surface-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.85rem;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.18);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s ease;
            z-index: 1000;
        }

        .heatmap-tooltip.show {
            opacity: 1;
        }

        .heatmap-stats {
            border-top: 1px solid var(--border-color);
            padding-top: 16px;
            color: var(--muted-color);
            font-size: 0.9rem;
        }

        .heatmap-stats-filter {
            margin-top: 8px;
        }

        .heatmap-stats strong {
            color: var(--text-color);
        }

        .heatmap-stats a {
            color: var(--accent-color);
            text-decoration: none;
        }

        .heatmap-stats a:hover {
            text-decoration: underline;
        }

        .heatmap-stats-hint {
            font-size: 0.8rem;
            margin-top: 4px;
        }

        .heatmap-years-toggle {
            font-size: 0.85rem;
        }

        .btn-link-like {
            padding: 0;
            border: 0;
            background: none;
            color: var(--accent-color);
            font: inherit;
            font-size: inherit;
            cursor: pointer;
        }

        .btn-link-like:hover {
            text-decoration: underline;
        }

        .lazy-loading {
            animation: pulse 1.6s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.9; }
        }

        @media (max-width: 768px) {
            body {
                padding: 24px 0;
            }

            .container-fluid {
                padding: 0 16px;
            }

            .chart-container,
            .table-container {
                padding: 20px;
            }

            .header h1 {
                font-size: 1.4rem;
            }

            .stats-cards {
                grid-template-columns: repeat(2, 1fr);
            }

            .cover-container {
                width: 64px;
                height: 40px;
            }

            .video-title {
                max-width: 200px;
            }

            .video-desc,
            .tags-container {
                max-width: 180px;
            }

            /* flex-wrap: nowrap 覆盖基础 .status-chips 的 wrap，
               让筛选 chips 挤成一行、靠 overflow-x 横向滑动，而不是换行 */
            .status-chips {
                flex-wrap: nowrap;
                overflow-x: auto;
                white-space: nowrap;
            }

            /* chips 独占一行横滑，视图切换组换到下一行、仍靠右 */
            .table-toolbar .status-chips {
                flex: 1 1 100%;
            }
        }

        @media (prefers-color-scheme: dark) {
            /* Bootstrap 把 select 的下拉箭头写死成深灰 data URI，深色下换浅色 */
            .custom-select {
                background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' width='4' height='5' viewBox='0 0 4 5'%3e%3cpath fill='%23A7B3BE' d='M2 0L0 2h4zm0 5L0 3h4z'/%3e%3c/svg%3e");
            }

            /* 深色下点纹更淡，避免在暗背景上过于显眼 */
            body {
                background-image: radial-gradient(circle, rgba(var(--ink-rgb), .06) 1px, transparent 1.3px);
            }

            /* 深色下封面带压得更暗，免得整片封面在暗背景上发光 */
            .hero-band {
                opacity: .30;
            }
        }

        .icon { width: 1em; height: 1em; vertical-align: -0.125em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .icon.spin { animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

    </style>
</head>
<body>
    <svg xmlns="http://www.w3.org/2000/svg" style="display:none">

    </svg>
    <div class="container-fluid">
        <!-- 头部 -->
        <div class="header">
            <div class="hero-band" id="heroBand" aria-hidden="true"></div>
            <h1><svg class="icon" aria-hidden="true"><use href="#i-gamepad"/></svg> 宋少弘（原游戏公民大会）视频投稿存档</h1>
            <p>永不退场的闯关族</p>
            <p class="hero-caption" id="heroCaption" hidden></p>
        </div>
        
        <!-- 统计卡片 -->
        <div class="stats-cards" id="statsCards">
            <div class="stat-card">
                <div class="stat-number num" id="statTotal">-</div>
                <div class="stat-label">总收录</div>
            </div>
            <div class="stat-card">
                <div class="stat-number num" id="statAvailable">-</div>
                <div class="stat-label">现存</div>
            </div>
            <div class="stat-card">
                <div class="stat-number num" id="statDeleted">-</div>
                <div class="stat-label">已删除</div>
                <div class="stat-note" id="statDeletedNote"></div>
            </div>
            <div class="stat-card">
                <div class="stat-number num" id="statBackup">-</div>
                <div class="stat-label">已补档</div>
            </div>
            <div class="stat-card">
                <div class="stat-number num" id="statPending">-</div>
                <div class="stat-label">待补档</div>
            </div>
            <div class="stat-card">
                <div class="stat-number num is-date" id="statRecheck">—</div>
                <div class="stat-label">上次巡检</div>
            </div>
        </div>

        <!-- 存续条 -->
        <div class="survival" id="survivalBar" role="img" aria-label="视频存续比例"></div>
        <div class="survival-legend" id="survivalLegend"></div>

        <!-- 标签云 -->
        <div class="chart-container collapsible">
            <div class="chart-header" onclick="toggleChart('tagcloud')">
                <div class="header-content">
                    <h3><svg class="icon" aria-hidden="true"><use href="#i-tag"/></svg> 标签热力云</h3>
                    <p>点击标签可筛选相关视频，标签大小表示使用频率</p>
                </div>
                <button type="button" class="collapse-btn" id="tagcloudToggle"
                        aria-expanded="true" aria-controls="tagCloud" aria-label="折叠或展开标签热力云"
                        onclick="event.stopPropagation(); toggleChart('tagcloud')">
                    <svg class="icon" aria-hidden="true"><use href="#i-chevron-up"/></svg>
                </button>
            </div>
            <div class="chart-content">
                <div class="tag-cloud" id="tagCloud">
                    <div class="tag-cloud-loading">
                        <svg class="icon spin" aria-hidden="true"><use href="#i-spinner"/></svg>
                        <span>正在生成标签云...</span>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 热力日历 -->
        <div class="chart-container collapsible">
            <div class="chart-header" onclick="toggleChart('heatmap')">
                <div class="header-content">
                    <h3><svg class="icon" aria-hidden="true"><use href="#i-calendar"/></svg> 投稿日历</h3>
                    <p>每格一天，颜色是当天投稿的存续状态；点击方块筛选当天投稿</p>
                </div>
                <button type="button" class="collapse-btn" id="heatmapToggle"
                        aria-expanded="true" aria-controls="heatmapCalendar" aria-label="折叠或展开投稿日历"
                        onclick="event.stopPropagation(); toggleChart('heatmap')">
                    <svg class="icon" aria-hidden="true"><use href="#i-chevron-up"/></svg>
                </button>
            </div>
            <div class="chart-content">
                <div id="heatmapCalendar" class="heatmap-container">
                    <div class="heatmap-loading">
                        <svg class="icon spin" aria-hidden="true"><use href="#i-spinner"/></svg>
                        <span>正在生成投稿日历...</span>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 表格容器 -->
        <div class="table-container">
            <div class="table-toolbar" id="tableToolbar">
                <div class="status-chips" id="statusChips"></div>
                <div class="toolbar-tools">

            <div id="errorMessage" class="error" style="display: none;">
                <svg class="icon" aria-hidden="true"><use href="#i-alert"/></svg>
                <strong>加载失败：</strong>请确保 db.json 文件在同一目录下。
            </div>
            
            <table id="videosTable" class="table table-striped table-hover" style="display: none;">
                <thead>
                    <tr>
