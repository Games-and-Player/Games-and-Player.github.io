name: Sync Reuploads
on:
  schedule:
    - cron: '5 22 * * 6'   # 北京时间每周日 06:05，在巡检之后
  workflow_dispatch:
concurrency:
  group: db-json          # 三个数据任务共用一把锁，撞车时排队而不是互相覆盖
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          BILIBILI_COOKIE: ${{ secrets.BILIBILI_COOKIE }}
        run: |
          set -o pipefail
          python scripts/update_reupload.py | tee reupload.log
      - run: python scripts/validate.py
      # update_lives.py 写的是 data/lives.json，与 validate.py 校验的 db.json 无关，
      # 放在 validate.py 之后只是顺着现有步骤顺序，没有依赖关系
      # continue-on-error：这步可能因风控/网络退出 2（巡检未知过多）或 1（登录/翻页失败），
      # 但退出 2 发生在 write_db 之前，data/lives.json 不会被半更新，让流程继续到 Commit，
      # 别把 update_reupload.py 已经成功的结果白白扔掉一周
      - env:
          BILIBILI_COOKIE: ${{ secrets.BILIBILI_COOKIE }}
        continue-on-error: true
        run: |
          set -o pipefail
          python scripts/update_lives.py | tee lives.log
      - name: Commit
        run: |
          if git diff --quiet db.json data/lives.json && [ -z "$(git status --porcelain covers/live)" ]; then echo "no changes"; exit 0; fi
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add db.json data/lives.json covers/live
          git commit -m "🔁 更新补档信息 $(date +'%Y%m%d') / 直播回放"
          git push || (git pull --rebase && git push)
