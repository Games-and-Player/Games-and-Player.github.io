<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宋少弘直播回放 · dimisong.org</title>
    <link rel="icon" type="image/png" href="favicon.png">

    <meta name="description" content="宋少弘（原游戏公民大会）B站直播回放存档：收录 2022 年至今的直播录像与回放记录，供查找与补档之用。">
    <link rel="canonical" href="https://dimisong.org/live.html">
    <meta property="og:type" content="website">
    <meta property="og:title" content="宋少弘直播回放">
    <meta property="og:description" content="直播录像与回放的记录。">
    <meta property="og:url" content="https://dimisong.org/live.html">
    <meta property="og:image" content="https://dimisong.org/favicon.png">

    <link rel="stylesheet" href="static/site.css?v=20260924">
</head>
<body class="live-page">
    <div class="container-fluid">
        <div class="header header--banner">
            <h1>宋少弘直播回放</h1>
            <p>直播录像与回放的记录</p>
            <nav class="site-nav"><a href="./">投稿存档</a><a href="live.html" aria-current="page">直播回放</a></nav>
        </div>

        <div class="lv-stats" id="lvStats">
            <div class="stat-card">
                <div class="stat-number num" id="lvStatCount">-</div>
                <div class="stat-label">场直播</div>
            </div>
            <div class="stat-card">
                <div class="stat-number num" id="lvStatHours">-</div>
                <div class="stat-label">小时录像</div>
            </div>
            <div class="stat-card">
                <div class="stat-number num is-date" id="lvStatFirst">—</div>
                <div class="stat-label">首场</div>
            </div>
            <div class="stat-card">
                <div class="stat-number num is-date" id="lvStatLast">—</div>
                <div class="stat-label">最近一场</div>
            </div>
        </div>

        <div class="lv-bar">
            <div class="lv-chips" id="lvChips" role="group" aria-label="按主题筛选"></div>
            <div class="live-search">
                <label for="liveSearch" class="live-sr-only">按日期或主题搜索</label>
                <input type="search" id="liveSearch" placeholder="按日期或主题搜索…" autocomplete="off">
            </div>
        </div>

        <p class="live-sr-only" id="liveStatus" aria-live="polite"></p>
        <div id="liveList"></div>
        <p class="live-empty" id="liveEmpty" hidden>没有匹配的直播</p>

        <footer class="site-footer">
            <p>© 2025–2026 <a href="https://space.bilibili.com/509617361" target="_blank" rel="noopener">風二中</a> 整理 · 视频内容版权归 <a href="https://space.bilibili.com/67390259" target="_blank" rel="noopener">宋少弘</a> 所有</p>
            <p>本站自 2025 年 5 月起整理宋少弘（原游戏公民大会）的 B 站投稿与直播回放记录，供查找与补档之用。</p>
            <p>2022–2024 年的早期直播录像由 <a href="https://space.bilibili.com/175513102" target="_blank" rel="noopener">辰默呵</a> 录制并上传，谨此致谢。</p>
        </footer>
    </div>

    <script>
    (function () {
        var WEEKDAYS = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
        var TOP_TOPICS_N = 6;

        function escapeHtml(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }

        function formatDuration(sec) {
            var h = Math.floor(sec / 3600);
            var m = Math.floor((sec % 3600) / 60);
            return h + ':' + String(m).padStart(2, '0');
        }

        function weekday(dateStr) {
            var d = new Date(dateStr + 'T00:00:00Z');
            return WEEKDAYS[d.getUTCDay()];
        }

        var allLives = [];
        var sameDayCounts = {};
        var currentTopic = ''; // '' = 全部

        function renderStats(lives) {
            var totalSec = lives.reduce(function (s, l) { return s + l.duration; }, 0);
            var hours = Math.round(totalSec / 3600);
            var dates = lives.map(function (l) { return l.date; });
            var earliest = dates.reduce(function (a, b) { return b < a ? b : a; });
            var latest = dates.reduce(function (a, b) { return b > a ? b : a; });
            document.getElementById('lvStatCount').textContent = lives.length;
            document.getElementById('lvStatHours').textContent = hours;
            document.getElementById('lvStatFirst').textContent = earliest;
            document.getElementById('lvStatLast').textContent = latest;
        }

        // 出现次数最多的非空主题：与 Python collections.Counter.most_common 同规则——
        // 按次数降序，次数相同时按数据里第一次出现的顺序（稳定排序）。
        function topTopics(lives, n) {
            var counts = {}, order = [];
            lives.forEach(function (l) {
                var t = l.topic;
                if (!t) return;
                if (!(t in counts)) { counts[t] = 0; order.push(t); }
                counts[t]++;
            });
            order.sort(function (a, b) { return counts[b] - counts[a]; });
            return order.slice(0, n).map(function (t) { return { topic: t, count: counts[t] }; });
        }

        function renderChips(lives) {
            var html = '<button type="button" class="lv-chip" data-topic="" aria-pressed="' +
                (currentTopic === '' ? 'true' : 'false') + '">全部<b>' + escapeHtml(String(lives.length)) + '</b></button>';
            topTopics(lives, TOP_TOPICS_N).forEach(function (item) {
                html += '<button type="button" class="lv-chip" data-topic="' + escapeHtml(item.topic) + '" aria-pressed="' +
                    (currentTopic === item.topic ? 'true' : 'false') + '">' + escapeHtml(item.topic) +
                    '<b>' + escapeHtml(String(item.count)) + '</b></button>';
            });
            document.getElementById('lvChips').innerHTML = html;
        }

        function updateChipPressed() {
            document.querySelectorAll('#lvChips .lv-chip').forEach(function (btn) {
                btn.setAttribute('aria-pressed', btn.dataset.topic === currentTopic ? 'true' : 'false');
            });
        }

        function renderCard(live) {
            var dead = !!live.dead_at;
            var sameDay = sameDayCounts[live.date] > 1;
            var aid = escapeHtml(String(live.aid));
            var coverHtml = live.cover_local
                ? '<img src="' + escapeHtml(live.cover_local) + '" alt="" loading="lazy" width="480" height="300">'
                : '';
            var badgeHtml = dead
                ? '<span class="lv-part lv-part--dead">已失效 ' + escapeHtml(live.dead_at) + '</span>'
                : (sameDay ? '<span class="lv-part">第 ' + escapeHtml(String(live.part)) + ' 段</span>' : '');
            var topicHtml = live.topic
                ? '<span class="lv-topic">' + escapeHtml(live.topic) + '</span>'
                : '<span class="lv-topic lv-topic--none">直播录像</span>';

            var body =
                '<span class="lv-cover">' + coverHtml + badgeHtml +
                '<span class="lv-dur"><span class="live-sr-only">时长 </span>' + escapeHtml(formatDuration(live.duration)) + '</span></span>' +
                '<span class="lv-body">' +
                '<span class="lv-date num">' + escapeHtml(live.date) + ' · ' + escapeHtml(weekday(live.date)) + '</span>' +
                topicHtml +
                '<span class="lv-meta"><span>' + escapeHtml(live.author.name) + '</span><span class="num">' +
                escapeHtml(String(live.views)) + ' 次播放</span></span>' +
                '</span>';

            if (dead) {
                return '<li><div class="lv-card lv-card--dead">' + body + '</div></li>';
            }
            return '<li><a class="lv-card" href="https://www.bilibili.com/video/av' + aid +
                '" target="_blank" rel="noopener">' + body + '</a></li>';
        }

        function matches(live, topic, q) {
            if (topic && live.topic !== topic) return false;
            if (!q) return true;
            return live.date.indexOf(q) !== -1 || (live.topic || '').toLowerCase().indexOf(q) !== -1;
        }

        function render() {
            var q = document.getElementById('liveSearch').value.trim().toLowerCase();
            var filtered = allLives.filter(function (l) { return matches(l, currentTopic, q); });

            var html = '', curYear = '', yearItems = [];
            function flushYear() {
                if (!curYear) return;
                var sec = yearItems.reduce(function (s, l) { return s + l.duration; }, 0);
                var hours = Math.round(sec / 3600);
                html += '<section class="lv-year"><h2>' + escapeHtml(curYear) + ' 年<span>' + escapeHtml(String(yearItems.length)) +
                    ' 场 · ' + escapeHtml(String(hours)) + ' 小时</span></h2><ul class="lv-grid">' +
                    yearItems.map(renderCard).join('') + '</ul></section>';
            }
            filtered.forEach(function (l) {
                var y = l.date.slice(0, 4);
                if (y !== curYear) { flushYear(); curYear = y; yearItems = []; }
                yearItems.push(l);
            });
            flushYear();

            document.getElementById('liveList').innerHTML = html;

            var filtering = !!(currentTopic || q);
            document.getElementById('liveStatus').textContent = filtering ? '匹配 ' + filtered.length + ' 场' : '';
            document.getElementById('liveEmpty').hidden = filtered.length > 0;
        }

        document.getElementById('lvChips').addEventListener('click', function (e) {
            var btn = e.target.closest('.lv-chip');
            if (!btn) return;
            currentTopic = btn.dataset.topic;
            updateChipPressed();
            render();
        });

        document.getElementById('liveSearch').addEventListener('input', render);

        fetch('data/lives.json')
            .then(function (r) { return r.json(); })
            .then(function (data) {
                allLives = data.lives || [];
                allLives.forEach(function (l) {
                    sameDayCounts[l.date] = (sameDayCounts[l.date] || 0) + 1;
                });
                renderStats(allLives);
                renderChips(allLives);
                render();
            })
            .catch(function (err) {
                var emptyEl = document.getElementById('liveEmpty');
                emptyEl.textContent = '加载失败，请刷新重试';
                emptyEl.hidden = false;
                console.error(err);
            });
    })();
    </script>
</body>
</html>
